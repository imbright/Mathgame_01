  <div class="app">
    <header class="topbar"><div class="brand" data-i18n="brand">数学乐园</div><div class="top-actions"><div class="pill"><span data-i18n="totalScore">总积分</span>: <strong id="topScore">0</strong></div><div class="pill timer-pill" id="timerPill" aria-live="polite"><span id="topTimer">40s</span></div><div class="lang-wrap"><button class="lang-btn" id="langBtn" type="button" aria-expanded="false"><span data-i18n="language">语言</span> ▾</button><div class="lang-menu" id="langMenu" aria-label="Language menu"></div></div></div></header>
    <main>

      <section class="page" id="pageCalc"><div class="panel-header"><div class="header-left"><button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button><div class="mini-score"><span data-i18n="singleScore">单项积分</span>: <strong id="scoreCalc">0</strong></div></div><div class="difficulty"><label data-i18n="difficulty">难度</label><select id="diffCalc"></select></div></div><div class="card"><div class="progress-mini" id="progressCalc"></div><div class="question-box" id="qCalc">题目：--</div><input class="answer-input" id="ansCalc" type="number" step="any" data-placeholder="answerPlaceholder"><div class="controls"><button class="action-btn btn-green" id="submitCalcBtn" data-i18n="submitBtn">提交答案</button><button class="action-btn btn-blue" id="nextCalcBtn" data-i18n="nextBtn">下一题</button><button class="action-btn btn-orange" id="showCalcBtn" data-i18n="showAnswerBtn">查看答案</button></div><div class="status" id="msgCalc"></div><div class="status info" id="showCalcAnswer"></div></div></section>

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}function solve24(nums){function rec(xs){if(xs.length===1)return Math.abs(xs[0].n-24)<1e-8?xs[0].s:null;for(let i=0;i<xs.length;i++)for(let j=i+1;j<xs.length;j++){const a=xs[i],b=xs[j],rest=xs.filter((_,k)=>k!==i&&k!==j),cs=[[a.n+b.n,`(${a.s}+${b.s})`],[a.n-b.n,`(${a.s}-${b.s})`],[b.n-a.n,`(${b.s}-${a.s})`],[a.n*b.n,`(${a.s}*${b.s})`],...(b.n?[[a.n/b.n,`(${a.s}/${b.s})`]]:[]),...(a.n?[[b.n/a.n,`(${b.s}/${a.s})`]]:[])];for(const[n,s]of cs){const r=rec([...rest,{n,s}]);if(r)return r}}return null}return rec(nums.map(n=>({n,s:String(n)})))}
function setQuestion(mode,text,answer,display=answer){state.questions[mode]={text,answer,display};state.answered[mode]=false;const map={game24:['q24','ans24','msg24','show24Answer'],calc:['qCalc','ansCalc','msgCalc','showCalcAnswer'],word:['qWord','ansWord','msgWord','showWordAnswer'],ultimate:['qUltimate','ansUltimate','msgUltimate','showUltimateAnswer']},ids=map[mode];$(ids[0]).textContent=text;$(ids[1]).value='';status(ids[2]);$(ids[3]).textContent='';startTimer(mode)}

function dataFor(type,level){let a,b,c,q,answer;switch(type){case'word':if(level==='easy'){a=rnd(8,30);b=rnd(2,15);q=state.lang==='zh'?`小明有 ${a} 个苹果，又买了 ${b} 个，一共有多少个？`:`${a} items plus ${b} more. What is the total?`;answer=a+b}else if(level==='normal'){a=rnd(4,16);b=rnd(3,12);q=state.lang==='zh'?`每盒有 ${a} 支铅笔，${b} 盒共有多少支？`:`${b} boxes have ${a} pencils each. How many pencils?`;answer=a*b}else if(level==='hard'){a=rnd(40,120);b=rnd(5,35);q=state.lang==='zh'?`${a} 个物品卖出 ${b} 个后还剩多少？`:`There are ${a} items; ${b} are sold. How many remain?`;answer=a-b}else{a=rnd(12,35);b=rnd(3,12);c=rnd(5,25);q=state.lang==='zh'?`${a} 辆车每辆坐 ${b} 人，另有 ${c} 人步行到达，共多少人？`:`${a} vehicles carry ${b} people each, plus ${c} people arrive. Total?`;answer=a*b+c}break;
case'fraction':if(level==='easy'){a=rnd(2,9);b=rnd(2,9);q=`${a}/${b} + 1/${b}`;answer=(a+1)/b}else if(level==='normal'){a=rnd(2,8);b=rnd(2,8);q=`${a}/3 + ${b}/3`;answer=(a+b)/3}else if(level==='hard'){a=rnd(2,8);b=rnd(2,8);q=`${a}/4 × ${b}/2`;answer=a*b/8}else{a=rnd(3,12);b=rnd(2,9);q=`${a}/${b} ÷ 2/${b}`;answer=a/2}break;
case'power':if(level==='easy'){a=rnd(2,12);q=`${a}²`;answer=a*a}else if(level==='normal'){a=rnd(2,9);b=rnd(2,3);q=`${a}^${b}`;answer=a**b}else if(level==='hard'){a=rnd(3,15);q=`√${a*a}`;answer=a}else{a=rnd(3,12);b=rnd(2,5);q=`${a}^${b} + √${(a+1)**2}`;answer=a**b+a+1}break;
case'equation':if(level==='easy'){a=rnd(2,20);b=rnd(2,20);q=`x + ${a} = ${a+b}`;answer=b}else if(level==='normal'){a=rnd(2,12);b=rnd(2,15);q=`${a}x = ${a*b}`;answer=b}else if(level==='hard'){a=rnd(2,8);b=rnd(2,15);c=rnd(2,12);q=`${a}x + ${b} = ${a*c+b}`;answer=c}else{a=rnd(2,8);b=rnd(2,10);c=rnd(2,9);q=`${a}(x - ${b}) = ${a*c}`;answer=b+c}break;
case'percent':a=level==='devil'?rnd(15,85):rnd(5,50);b=rnd(20,400);q=`${a}% of ${b}`;answer=a*b/100;break;
case'sequence':a=rnd(2,12);b=rnd(2,8);if(level==='easy'){q=`${a}, ${a+b}, ${a+2*b}, ?`;answer=a+3*b}else if(level==='normal'){q=`${a}, ${a*b}, ${a*b*b}, ?`;answer=a*b**3}else if(level==='hard'){q=`2, 6, 12, 20, 30, ?`;answer=42}else{q=`1, 1, 2, 3, 5, 8, ?`;answer=13}break;
case'game24':{let ns,sol;do{ns=[rnd(1,13),rnd(1,13),rnd(1,13),rnd(1,13)];sol=solve24(ns)}while(!sol);return{q:`${ns.join('  ')} = 24`,answer:24,display:sol,isFormula:true}}
default:if(level==='easy'){a=rnd(2,30);b=rnd(2,30);q=`${a} + ${b}`;answer=a+b}else if(level==='normal'){a=rnd(12,50);b=rnd(3,15);q=`${a} × ${b}`;answer=a*b}else if(level==='hard'){a=rnd(20,90);b=rnd(4,25);c=rnd(2,10);q=`(${a} - ${b}) × ${c}`;answer=(a-b)*c}else{a=rnd(25,120);b=rnd(8,45);c=rnd(2,12);const divisor=c;q=`(${divisor*rnd(8,25)} + ${divisor*rnd(3,10)}) ÷ ${divisor}`;const n=q.match(/\d+/g).map(Number);answer=(n[0]+n[1])/n[2]}}return{q,answer,display:answer}}

function checkSudoku(){if(state.answered.sudoku)return;const cells=[...document.querySelectorAll('.sudoku-cell')];if(cells.some(e=>!e.value)){status('msgSudoku',tr('sudokuIncomplete'),'error');return}const ok=cells.every((e,i)=>Number(e.value)===SOL[Math.floor(i/9)][i%9]);state.answered.sudoku=true;clearTimer();if(ok){status('msgSudoku',tr('sudokuCorrect'),'success');mark('sudoku','correct');award('sudoku','normal')}else{status('msgSudoku',tr('sudokuWrong'),'error');mark('sudoku','wrong')}}
function renderPlayers(){const list=$('multiPlayers');list.innerHTML='';state.players.forEach(p=>{const row=document.createElement('div'),head=document.createElement('div'),n=document.createElement('span'),sc=document.createElement('span'),bar=document.createElement('div'),fill=document.createElement('div');row.className='player-row';head.className='player-head';n.textContent=p.user?`${tr('you')} (${p.name})`:p.name;sc.textContent=`${tr('score')}: ${p.score}`;head.append(n,sc);bar.className='mini-bar';fill.className='mini-fill';fill.style.width=`${Math.min(100,p.progress*10)}%`;bar.appendChild(fill);row.append(head,bar);list.appendChild(row)})}
function addBot(){if(state.players.filter(p=>!p.user).length>=4)return;state.players.push({name:`${tr('bot')} ${state.players.filter(p=>!p.user).length+1}`,score:0,progress:0,user:false});renderPlayers()}function resetMulti(){if(state.multiActive)return;state.players=[{name:state.playerName||tr('you'),score:0,progress:0,user:true}];renderPlayers();$('multiQuestion').textContent='题目：--';$('multiAns').value='';status('msgMulti');renderProgress('multi')}function clearBots(){state.multiActive=false;clearTimer();state.multiRound=0;state.players=[{name:state.playerName||tr('you'),score:0,progress:0,user:true}];renderPlayers();$('multiQuestion').textContent='题目：--';$('multiAns').value='';$('rankBox').classList.add('hidden');status('msgMulti');renderProgress('multi')}
function startMulti(){if(!state.players.some(p=>!p.user)){status('msgMulti',tr('emptyBots'),'error');return}state.multiActive=true;state.multiRound=0;state.players.forEach(p=>{p.score=0;p.progress=0});$('rankBox').classList.add('hidden');nextMulti()}function nextMulti(){if(!state.multiActive)return;if(state.multiRound>=10){finishMulti();return}state.multiRound++;newNumeric('multi',$('multiType').value,$('multiDifficulty').value);$('multiQuestion').textContent=`${tr('progressLabel')} ${state.multiRound}/10 · ${state.questions.multi.q}`}
function botTurn(){state.players.slice(1).forEach(bot=>{bot.progress++;const chance={easy:.38,normal:.52,hard:.66,devil:.78}[$('multiDifficulty').value]||.6;if(Math.random()<chance)bot.score+=18});renderPlayers()}function submitMulti(){if(!state.multiActive||state.answered.multi)return;const raw=$('multiAns').value.trim(),formula=$('multiType').value==='game24',v=formula?evalFormula(raw):Number(raw);if(!raw||v===null||!Number.isFinite(v)){status('msgMulti',tr(formula?'invalidFormula':'invalid'),'error');return}state.answered.multi=true;clearTimer();if(Math.abs(v-state.questions.multi.answer)<1e-8){state.players[0].score+=18;state.players[0].progress++;status('msgMulti',tr('correct'),'success');mark('multi','correct');award('multi','easy')}else{status('msgMulti',tr('wrong'),'error');mark('multi','wrong')}setTimeout(()=>{if(!state.multiActive)return;botTurn()},500);}
function finishMulti(){state.multiActive=false;clearTimer();const box=$('rankBox');box.innerHTML='';const h=document.createElement('h3');h.textContent=tr('finalRank');box.appendChild(h);[...state.players].sort((a,b)=>b.score-a.score).forEach((p,i)=>{const row=document.createElement('div');row.textContent=`${i+1}. ${p.user?tr('you'):p.name} — ${p.score}`;box.appendChild(row)});box.classList.remove('hidden');status('msgMulti',tr('roundDone'),'success')}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>activatePage(b.dataset.page));document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>activatePage('homePage'));$('langBtn').onclick=()=>{const open=$('langMenu').classList.toggle('open');$('langBtn').setAttribute('aria-expanded',String(open))};document.addEventListener('click',e=>{if(!e.target.closest('.lang-wrap')){$('langMenu').classList.remove('open');$('langBtn').setAttribute('aria-expanded','false')}});
$('submit24Btn').onclick=()=>submit('game24');$('next24Btn').onclick=new24;$('show24Btn').onclick=()=>showAnswer('game24');$('submitCalcBtn').onclick=()=>submit('calc');$('nextCalcBtn').onclick=()=>newNumeric('calc','calc',$('diffCalc').value);$('showCalcBtn').onclick=()=>showAnswer('calc');$('submitWordBtn').onclick=()=>submit('word');$('nextWordBtn').onclick=()=>newNumeric('word','word',$('diffWord').value);$('showWordBtn').onclick=()=>showAnswer('word');$('checkSudokuBtn').onclick=checkSudoku;$('newSudokuBtn').onclick=newSudoku;$('submitUltimateBtn').onclick=()=>submit('ultimate');$('nextUltimateBtn').onclick=()=>newNumeric('ultimate',$('ultimateType').value,'devil');$('showUltimateBtn').onclick=()=>showAnswer('ultimate');$('addBotBtn').onclick=addBot;$('clearPlayersBtn').onclick=clearBots;$('startMultiBtn').onclick=startMulti;$('submitMultiBtn').onclick=submitMulti;$('nextMultiBtn').onclick=nextMulti;
$('ultimateType').onchange=()=>{if(state.activeMode==='ultimate')newNumeric('ultimate',$('ultimateType').value,'devil')};$('multiType').onchange=()=>{if(state.multiActive)nextMulti()};$('multiDifficulty').onchange=()=>{if(state.multiActive)nextMulti()};['diff24','diffCalc','diffWord','diffSudoku'].forEach(id=>$(id).onchange=()=>{const page={diff24:'page24',diffCalc:'pageCalc',diffWord:'pageWord',diffSudoku:'pageSudoku'}[id];if(document.getElementById(page).classList.contains('active'))({diff24:new24,diffCalc:()=>newNumeric('calc','calc',$('diffCalc').value),diffWord:()=>newNumeric('word','word',$('diffWord').value),diffSudoku:newSudoku}[id])()});$('playerName').oninput=e=>{state.playerName=e.target.value.slice(0,24);save();leaderboard();if(state.players[0]?.user){state.players[0].name=state.playerName||tr('you');renderPlayers()}};$('playerId').oninput=e=>{state.playerId=e.target.value.slice(0,20);save()}}
function init(){load();renderLanguage();fillOptions();bind();$('playerName').value=state.playerName;$('playerId').value=state.playerId;setLanguage(state.lang);scores();['game24','calc','word','sudoku','multi','ultimate'].forEach(renderProgress);state.players=[{name:state.playerName||tr('you'),score:0,progress:0,user:true}];renderPlayers();$('topTimer').textContent='40s';activatePage('homePage')}
init();
</script>
</body>
