<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Puzzle Park</title>
  <style>
    :root {
      --bg1: #eef4ff;
      --bg2: #eefaf4;
      --card: #ffffff;
      --soft: #f7f9ff;
      --line: #e6ebf3;
      --text: #1d2a3a;
      --muted: #63758b;
      --primary: #4d6ef3;
      --primary-2: #7b8eff;
      --green: #22b66d;
      --red: #ea5a55;
      --yellow: #efb94e;
      --gold: #a86d00;
      --shadow: 0 16px 36px rgba(24, 41, 72, .10);
      --white: #ffffff;
      --progress-empty: #ffffff;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(140deg, var(--bg1), var(--bg2));
      color: var(--text);
      font-family: "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body { overflow-x: hidden; }

    .app {
      max-width: 1220px;
      margin: 0 auto;
      padding: 22px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 16px 18px;
      position: sticky;
      top: 12px;
      z-index: 20;
      backdrop-filter: blur(10px);
    }

    .brand {
      font-size: clamp(1.7rem, 2vw, 2.2rem);
      font-weight: 900;
      letter-spacing: .03em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .score-pill {
      min-width: 150px;
      text-align: center;
      padding: 10px 16px;
      border-radius: 14px;
      border: 1px solid #f1d289;
      background: #fff9ea;
      color: var(--gold);
      font-weight: 800;
    }

    .lang-wrap { position: relative; }

    .lang-btn {
      min-width: 118px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: .98rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(15,23,42,0.04);
    }

    .lang-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 170px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 6px;
      display: none;
      z-index: 30;
    }

    .lang-menu.open { display: grid; }

    .lang-option {
      border: none;
      background: #fff;
      text-align: left;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 0.96rem;
      color: var(--text);
      font-weight: 600;
    }

    .lang-option:hover { background: #f3f6ff; }

    .progress-box {
      margin: 18px 0 24px;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.72);
      box-shadow: var(--shadow);
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .dots-40 {
      display: grid;
      grid-template-columns: repeat(40, minmax(8px, 1fr));
      gap: 5px;
      align-items: center;
    }

    .dot {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #dfe7f3;
    }

    .dot.empty { background: #fff; }
    .dot.correct { background: var(--green); border-color: #1ea764; }
    .dot.wrong { background: var(--red); border-color: #d74e48; }

    .page { display: none; }
    .page.active { display: block; animation: fade .22s ease; }

    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .home-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.2rem);
      letter-spacing: 0.04em;
      font-weight: 900;
    }

    .player-box {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      background: linear-gradient(135deg, #f9fbff, #f2f6ff);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .field {
      flex: 1;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field label {
      color: var(--muted);
      font-weight: 700;
      font-size: .95rem;
    }

    .field input, .answer, .difficulty select {
      width: 100%;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    .field input:focus, .answer:focus, .difficulty select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(77, 110, 243, .08);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
    }

    .game-btn {
      width: 100%;
      min-height: 96px;
      border: none;
      border-radius: 18px;
      color: #fff;
      font-size: 1.08rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(26,45,90,0.12);
      transition: transform .16s ease, filter .16s ease;
    }

    .game-btn:hover { transform: translateY(-2px); filter: brightness(1.04); }
    .game-btn:disabled { opacity: .5; cursor: not-allowed; }

    .btn-blue { background: linear-gradient(135deg, #5575ff, #7d94ff); }
    .btn-green { background: linear-gradient(135deg, #22b66d, #33d188); }
    .btn-orange { background: linear-gradient(135deg, #f39a2c, #ffbb5c); }
    .btn-purple { background: linear-gradient(135deg, #815ef1, #aa82ff); }
    .btn-red { background: linear-gradient(135deg, #eb5a5a, #ff7f7b); }
    .btn-gold { background: linear-gradient(135deg, #cf931b, #efbe53); }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .back-btn, .action-btn, .soft-btn {
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
    }

    .back-btn { background: linear-gradient(135deg, #eb5a5a, #ff7b7b); }
    .action-btn.btn-green { background: linear-gradient(135deg, #1caf69, #2ad97d); }
    .action-btn.btn-blue { background: linear-gradient(135deg, #5575ff, #7d94ff); }
    .action-btn.btn-orange { background: linear-gradient(135deg, #ef9b30, #ffbd5d); }
    .action-btn.btn-red { background: linear-gradient(135deg, #eb5a5a, #ff7b7b); }
    .soft-btn { background: linear-gradient(135deg, #edf3ff, #eff5ff); color: var(--primary); }

    .mini-score {
      background: #fff9ea;
      border: 1px solid #f1d089;
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--gold);
      font-weight: 800;
    }

    .difficulty {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-weight: 700;
      flex-wrap: wrap;
    }

    .difficulty select {
      min-width: 210px;
      background: #fff;
    }

    .question-box {
      min-height: 90px;
      margin: 18px 0 12px;
      padding: 18px 16px;
      border: 1px solid #e4ebff;
      background: #f8faff;
      border-radius: 16px;
      font-size: clamp(1.1rem, 2vw, 1.42rem);
      line-height: 1.6;
      font-weight: 800;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .answer-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 14px 16px;
      font-size: 1.04rem;
      outline: none;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .status {
      min-height: 28px;
      margin-top: 16px;
      font-weight: 800;
    }

    .status.success { color: var(--green); }
    .status.error { color: var(--red); }
    .status.info { color: var(--primary); }

    .progress-mini {
      display: grid;
      grid-template-columns: repeat(10, minmax(8px, 1fr));
      gap: 6px;
      margin: 14px 0 6px;
      align-items: center;
    }

    .progress-mini .dot {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #dde6f4;
    }

    .progress-mini .dot.correct { background: var(--green); border-color: #1ea764; }
    .progress-mini .dot.wrong { background: var(--red); border-color: #d74e48; }

    .sudoku-board {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: 4px;
      max-width: 430px;
      margin: 18px auto 8px;
      padding: 8px;
      border: 2px solid #ced9ee;
      border-radius: 14px;
      background: #f7f9ff;
    }

    .sudoku-cell {
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid #dfe7f2;
      border-radius: 8px;
      background: #fff;
      text-align: center;
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text);
      outline: none;
    }

    .sudoku-cell.fixed {
      background: #eef3ff;
      color: var(--muted);
    }

    .sudoku-cell:nth-child(3n) { margin-right: 2px; }
    .sudoku-cell:nth-child(n + 19):nth-child(-n + 27),
    .sudoku-cell:nth-child(n + 46):nth-child(-n + 54) {
      border-bottom: 2px solid #cfe0f2;
    }

    .multi-list {
      display: grid;
      gap: 12px;
      margin: 18px 0;
    }

    .player-row {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      background: #fff;
    }

    .player-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .mini-bar {
      height: 10px;
      background: #edf0f6;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .mini-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #3bc9a8);
      border-radius: inherit;
      transition: width .2s ease;
    }

    .leaderboard {
      margin-top: 18px;
      padding: 16px;
      border-radius: 16px;
      background: #f8faff;
      border: 1px solid var(--line);
    }

    .leaderboard h3 { margin: 0 0 8px; }
    .leaderboard-list { display: grid; gap: 7px; }

    .hidden { display: none !important; }

    @media (max-width: 700px) {
      .app { padding: 14px; }
      .topbar { padding: 12px 14px; }
      .game-grid { grid-template-columns: 1fr 1fr; }
      .card { padding: 18px; }
      .dots-40 { gap: 4px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand" data-i18n="brand">数学乐园</div>
      <div class="top-actions">
        <div class="score-pill"><span data-i18n="totalScore">总积分</span>: <strong id="topScore">0</strong></div>
        <div class="lang-wrap">
          <button class="lang-btn" id="langBtn" type="button" aria-expanded="false">
            <span data-i18n="language">语言</span> ▾
          </button>
          <div class="lang-menu" id="langMenu" aria-label="Language menu"></div>
        </div>
      </div>
    </header>

    <div class="progress-box">
      <div class="progress-head">
        <span data-i18n="progressLabel">进度</span>
        <span id="globalProgressText">0 / 40</span>
      </div>
      <div class="dots-40" id="globalDots"></div>
    </div>

    <main>
      <section class="page active" id="homePage">
        <div class="home-head">
          <h1 class="title" data-i18n="homeTitle">数学益智乐园</h1>
          <div class="score-pill"><span data-i18n="totalScore">总积分</span>: <strong id="homeScore">0</strong></div>
        </div>

        <div class="card">
          <div class="player-box">
            <div class="field">
              <label data-i18n="playerName">玩家名字</label>
              <input id="playerName" type="text" maxlength="24" placeholder="请输入名字" />
            </div>
            <div class="field">
              <label data-i18n="playerId">玩家 ID</label>
              <input id="playerId" type="text" maxlength="20" placeholder="自定义 ID" />
            </div>
          </div>

          <div class="game-grid">
            <button class="game-btn btn-blue" data-page="page24" data-i18n="game24">24 点</button>
            <button class="game-btn btn-green" data-page="pageCalc" data-i18n="gameCalc">口算</button>
            <button class="game-btn btn-orange" data-page="pageWord" data-i18n="gameWord">应用题</button>
            <button class="game-btn btn-purple" data-page="pageSudoku" data-i18n="gameSudoku">数独</button>
            <button class="game-btn btn-red" data-page="pageMulti" data-i18n="gameMulti">多人对战</button>
            <button class="game-btn btn-gold" data-page="pageUltimate" id="ultimateBtn" data-i18n="ultimateBtn">终极测试（40分解锁）</button>
          </div>

          <div class="leaderboard" id="leaderboardBox">
            <h3 data-i18n="rankTitle">排行榜</h3>
            <div class="leaderboard-list" id="leaderboardList"></div>
          </div>
        </div>
      </section>

      <section class="page" id="page24">
        <div class="panel-header">
          <div class="header-left">
            <button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button>
            <div class="mini-score"><span data-i18n="singleScore">单项积分</span>: <strong id="score24">0</strong></div>
          </div>
          <div class="difficulty">
            <span data-i18n="difficulty">难度</span>
            <select id="diff24"></select>
          </div>
        </div>

        <div class="card">
          <div class="progress-mini" id="progress24"></div>
          <div class="question-box" id="q24">题目：--</div>
          <input class="answer-input" id="ans24" type="text" placeholder="输入算式" />
          <div class="controls">
            <button class="action-btn btn-green" id="submit24Btn" data-i18n="submitBtn">提交答案</button>
            <button class="action-btn btn-blue" id="next24Btn" data-i18n="nextBtn">下一题</button>
            <button class="action-btn btn-orange" id="show24Btn" data-i18n="showAnswerBtn">查看答案</button>
          </div>
          <div class="status" id="msg24"></div>
          <div class="status info" id="show24Answer"></div>
          <div class="status info" id="timer24"></div>
        </div>
      </section>

      <section class="page" id="pageCalc">
        <div class="panel-header">
          <div class="header-left">
            <button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button>
            <div class="mini-score"><span data-i18n="singleScore">单项积分</span>: <strong id="scoreCalc">0</strong></div>
          </div>
          <div class="difficulty">
            <span data-i18n="difficulty">难度</span>
            <select id="diffCalc"></select>
          </div>
        </div>

        <div class="card">
          <div class="progress-mini" id="progressCalc"></div>
          <div class="question-box" id="qCalc">题目：--</div>
          <input class="answer-input" id="ansCalc" type="number" step="any" placeholder="输入答案" />
          <div class="controls">
            <button class="action-btn btn-green" id="submitCalcBtn" data-i18n="submitBtn">提交答案</button>
            <button class="action-btn btn-blue" id="nextCalcBtn" data-i18n="nextBtn">下一题</button>
            <button class="action-btn btn-orange" id="showCalcBtn" data-i18n="showAnswerBtn">查看答案</button>
          </div>
          <div class="status" id="msgCalc"></div>
          <div class="status info" id="showCalcAnswer"></div>
          <div class="status info" id="timerCalc"></div>
        </div>
      </section>

      <section class="page" id="pageWord">
        <div class="panel-header">
          <div class="header-left">
            <button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button>
            <div class="mini-score"><span data-i18n="singleScore">单项积分</span>: <strong id="scoreWord">0</strong></div>
          </div>
          <div class="difficulty">
            <span data-i18n="difficulty">难度</span>
            <select id="diffWord"></select>
          </div>
        </div>

        <div class="card">
          <div class="progress-mini" id="progressWord"></div>
          <div class="question-box" id="qWord">题目：--</div>
          <input class="answer-input" id="ansWord" type="number" step="any" placeholder="输入答案" />
          <div class="controls">
            <button class="action-btn btn-green" id="submitWordBtn" data-i18n="submitBtn">提交答案</button>
            <button class="action-btn btn-blue" id="nextWordBtn" data-i18n="nextBtn">下一题</button>
            <button class="action-btn btn-orange" id="showWordBtn" data-i18n="showAnswerBtn">查看答案</button>
          </div>
          <div class="status" id="msgWord"></div>
          <div class="status info" id="showWordAnswer"></div>
          <div class="status info" id="timerWord"></div>
        </div>
      </section>

      <section class="page" id="pageSudoku">
        <div class="panel-header">
          <div class="header-left">
            <button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button>
            <div class="mini-score"><span data-i18n="singleScore">单项积分</span>: <strong id="scoreSudoku">0</strong></div>
          </div>
          <div class="difficulty">
            <span data-i18n="difficulty">难度</span>
            <select id="diffSudoku"></select>
          </div>
        </div>

        <div class="card">
          <div class="progress-mini" id="progressSudoku"></div>
          <div id="sudokuBoard" class="sudoku-board"></div>
          <div class="controls">
            <button class="action-btn btn-green" id="checkSudokuBtn" data-i18n="checkBtn">检查答案</button>
            <button class="action-btn btn-blue" id="newSudokuBtn" data-i18n="newSudokuBtn">新数独</button>
            <button class="soft-btn" id="retrySudokuBtn" data-i18n="retryBtn">错题重做</button>
          </div>
          <div class="status" id="msgSudoku"></div>
          <div class="status info" id="timerSudoku"></div>
        </div>
      </section>

      <section class="page" id="pageMulti">
        <div class="panel-header">
          <div class="header-left">
            <button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button>
            <div class="mini-score"><span data-i18n="multiRank">多人排行</span></div>
          </div>
        </div>

        <div class="card">
          <div class="controls">
            <button class="action-btn btn-blue" id="addBotBtn" data-i18n="addBotBtn">添加 Bot</button>
            <button class="action-btn btn-red" id="clearPlayersBtn" data-i18n="clearBtn">清空</button>
            <button class="action-btn btn-green" id="startMultiBtn" data-i18n="startBtn">开始</button>
          </div>

          <div class="multi-list" id="multiPlayers"></div>
          <div class="progress-mini" id="progressMulti"></div>
          <div class="question-box" id="multiQuestion">题目：--</div>
          <input class="answer-input" id="multiAns" type="number" placeholder="输入答案" />
          <div class="controls">
            <button class="action-btn btn-green" id="submitMultiBtn" data-i18n="submitBtn">提交答案</button>
            <button class="soft-btn" id="retryMultiBtn" data-i18n="retryBtn">错题重做</button>
          </div>
          <div class="status" id="msgMulti"></div>
          <div class="status info" id="timerMulti"></div>
          <div class="leaderboard hidden" id="rankBox"></div>
        </div>
      </section>

      <section class="page" id="pageUltimate">
        <div class="panel-header">
          <div class="header-left">
            <button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button>
            <div class="mini-score"><span data-i18n="ultimateScore">终极测试</span>: <strong id="scoreUltimate">0</strong></div>
          </div>
          <div class="difficulty">
            <span data-i18n="difficulty">难度</span>
            <select id="diffUltimate"></select>
          </div>
        </div>

        <div class="card">
          <div class="progress-mini" id="progressUltimate"></div>
          <div class="question-box" id="qUltimate">题目：--</div>
          <input class="answer-input" id="ansUltimate" type="number" step="any" placeholder="输入答案" />
          <div class="controls">
            <button class="action-btn btn-green" id="submitUltimateBtn" data-i18n="submitBtn">提交答案</button>
            <button class="action-btn btn-blue" id="nextUltimateBtn" data-i18n="nextBtn">下一题</button>
            <button class="action-btn btn-orange" id="showUltimateBtn" data-i18n="showAnswerBtn">查看答案</button>
          </div>
          <div class="status" id="msgUltimate"></div>
          <div class="status info" id="showUltimateAnswer"></div>
          <div class="status info" id="timerUltimate"></div>
        </div>
      </section>
    </main>
  </div>

    function saveState() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          lang: state.lang,
          totalScore: state.totalScore,
          scores: state.scores,
          playerName: state.playerName,
          playerId: state.playerId,
          leaderboard: state.leaderboard
        }));
      } catch (e) {
        console.warn('save failed', e);
      }
    }

    function loadState() {
      try {
        const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
        if (!raw) return;
        state.lang = LANGS[raw.lang] ? raw.lang : 'zh';
        state.totalScore = Number(raw.totalScore || 0);
        state.scores = { ...state.scores, ...(raw.scores || {}) };
        state.playerName = raw.playerName || '';
        state.playerId = raw.playerId || '';
        state.leaderboard = Array.isArray(raw.leaderboard) ? raw.leaderboard : [];
      } catch (e) {
        console.warn('load failed', e);
      }
    }

    function setStatus(id, text = '', kind = '') {
      const el = $(id);
      if (!el) return;
      el.textContent = text;
      el.className = 'status' + (kind ? ' ' + kind : '');
    }

    function updateScores() {
      $('topScore').textContent = state.totalScore;
      $('homeScore').textContent = state.totalScore;
      const map = { score24: 'game24', scoreCalc: 'calc', scoreWord: 'word', scoreSudoku: 'sudoku', scoreUltimate: 'ultimate' };
      Object.entries(map).forEach(([id, key]) => {
        const e = $(id);
        if (e) e.textContent = state.scores[key] || 0;
      });
      const ultimateBtn = $('ultimateBtn');
      if (ultimateBtn) {
        ultimateBtn.disabled = state.totalScore < UNLOCK_TOTAL;
        ultimateBtn.style.opacity = state.totalScore < UNLOCK_TOTAL ? '.5' : '1';
      }
    }

    function renderLeaderboard() {
      const list = $('leaderboardList');
      if (!list) return;
      list.innerHTML = '';
      const entries = state.leaderboard.length ? state.leaderboard : [
        { name: 'Player 1', score: 0 },
        { name: 'Player 2', score: 0 },
        { name: 'Player 3', score: 0 }
      ];
      entries.slice(0, 5).forEach((entry, index) => {
        const row = document.createElement('div');
        row.textContent = `${index + 1}. ${entry.name} - ${entry.score}`;
        list.appendChild(row);
      });
    }

    function addLeaderboardEntry(name, score) {
      state.leaderboard = [...state.leaderboard, { name, score }]
        .sort((a, b) => b.score - a.score)
        .slice(0, 5);
      saveState();
      renderLeaderboard();
    }

    function updateGlobalProgress() {
      const ids = ['game24', 'calc', 'word', 'sudoku', 'multi', 'ultimate'];
      const all = [];
      ids.forEach((key) => {
        const arr = state.progress[key] || [];
        const correctCount = arr.filter(v => v === 'correct').length;
        const text = `${correctCount} / ${arr.length || 10}`;
        if (key === 'game24') {
          const box = $('progress24');
          renderMiniDots(box, arr, 10);
        }
        if (key === 'calc') renderMiniDots($('progressCalc'), state.progress.calc, 10);
        if (key === 'word') renderMiniDots($('progressWord'), state.progress.word, 10);
        if (key === 'sudoku') renderMiniDots($('progressSudoku'), state.progress.sudoku, 10);
        if (key === 'multi') renderMiniDots($('progressMulti'), state.progress.multi, 10);
        if (key === 'ultimate') renderMiniDots($('progressUltimate'), state.progress.ultimate, 10);
        all.push(...arr);
      });
      const totalCorrect = all.filter(v => v === 'correct').length;
      const box = $('globalDots');
      if (box) {
        box.innerHTML = '';
        for (let i = 0; i < 40; i++) {
          const dot = document.createElement('div');
          dot.className = 'dot ' + (i < totalCorrect ? 'correct' : 'empty');
          box.appendChild(dot);
        }
      }
      $('globalProgressText').textContent = `${totalCorrect} / 40`;
    }

    function renderMiniDots(container, arr, count = 10) {
      if (!container) return;
      const values = Array.isArray(arr) ? arr.slice() : [];
      while (values.length < count) values.push('empty');
      container.innerHTML = '';
      values.slice(0, count).forEach((v) => {
        const d = document.createElement('div');
        d.className = 'dot ' + (v === 'correct' ? 'correct' : v === 'wrong' ? 'wrong' : 'empty');
        container.appendChild(d);
      });
    }

    function markProgress(key, status) {
      const arr = state.progress[key] || [];
      if (arr.length >= 10) arr.shift();
      arr.push(status);
      state.progress[key] = arr;
      updateGlobalProgress();
    }

    function addPoints(gameKey, points) {
      state.totalScore += points;
      state.scores[gameKey] = (state.scores[gameKey] || 0) + points;
      updateScores();
      saveState();
      addLeaderboardEntry(state.playerName || tr('you'), state.totalScore);
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function solve24(nums) {
      const values = nums.slice();
      const combine = (arr, exprs) => {
        if (arr.length === 1) {
          return Math.abs(arr[0] - 24) < 1e-9 ? exprs[0] : null;
        }
        for (let i = 0; i < arr.length; i++) {
          for (let j = i + 1; j < arr.length; j++) {
            const a = arr[i];
            const b = arr[j];
            const restV = arr.filter((_, idx) => idx !== i && idx !== j);
            const restE = exprs.filter((_, idx) => idx !== i && idx !== j);
            const candidates = [
              [a + b, `(${exprs[i]} + ${exprs[j]})`],
              [a - b, `(${exprs[i]} - ${exprs[j]})`],
              [b - a, `(${exprs[j]} - ${exprs[i]})`],
              [a * b, `(${exprs[i]} * ${exprs[j]})`]
            ];
            if (Math.abs(b) > 1e-9) candidates.push([a / b, `(${exprs[i]} / ${exprs[j]})`]);
            if (Math.abs(a) > 1e-9) candidates.push([b / a, `(${exprs[j]} / ${exprs[i]})`]);
            for (const [v, e] of candidates) {
              const result = combine([...restV, v], [...restE, e]);
              if (result) return result;
            }
          }
        }
        return null;
      };
      return combine(values.map(Number), values.map(String));
    }

    function create24Question() {
      const level = $('diff24').value;
      const maxMap = { easy: 10, normal: 13, hard: 20, devil: 30 };
      const max = maxMap[level] || 10;
      let arr = [];
      for (let tries = 0; tries < 300; tries++) {
        arr = [randomInt(1, max), randomInt(1, max), randomInt(1, max), randomInt(1, max)];
        if (solve24(arr)) break;
      }
      if (!solve24(arr)) arr = [1, 3, 4, 6];
      const answer = solve24(arr);
      state.questions.game24 = { nums: arr, answer };
      $('q24').textContent = `Numbers: ${arr.join('  ')}`;
      $('ans24').value = '';
      setStatus('msg24', '', '');
      $('show24Answer').textContent = '';
      startTimer('game24', 20, () => {
        if (state.page !== 'page24') return;
        setStatus('msg24', tr('timeUp'), 'error');
        markProgress('game24', 'wrong');
        state.retryQueue.push({ type: 'game24', payload: state.questions.game24 });
      });
    }

    function parseFormula(text) {
      const s = text.replace(/\s+/g, '');
      if (!s || !/^[0-9+\-*/().]+$/.test(s)) return null;
      try {
        const out = Function(`"use strict"; return (${s});`)();
        return Number.isFinite(out) ? out : null;
      } catch (e) {
        return null;
      }
    }

    function handle24Submit() {
      const q = state.questions.game24;
      if (!q) return;
      const raw = $('ans24').value.trim();
      const result = parseFormula(raw);
      if (raw === '' || result === null) {
        setStatus('msg24', tr('invalidFormula'), 'error');
        return;
      }
      const nums = raw.match(/[0-9]+(?:\.[0-9]+)?/g) || [];
      const sortedInput = nums.map(Number).sort((a, b) => a - b);
      const sortedGiven = [...q.nums].sort((a, b) => a - b);
      if (sortedInput.length !== 4 || sortedInput.some((n, i) => n !== sortedGiven[i]) || Math.abs(result - 24) > 1e-8) {
        setStatus('msg24', tr('invalid24'), 'error');
        markProgress('game24', 'wrong');
        state.retryQueue.push({ type: 'game24', payload: q });
        playTone('wrong');
        clearTimer('game24');
        return;
      }
      setStatus('msg24', tr('correct'), 'success');
      $('show24Answer').textContent = `${tr('answerIs')}${q.answer}`;
      addPoints('game24', getDifficultyValue('diff24'));
      markProgress('game24', 'correct');
      playTone('correct');
      clearTimer('game24');
      setTimeout(() => create24Question(), 700);
    }

    function show24Answer() {
      const q = state.questions.game24;
      if (!q) return;
      $('show24Answer').textContent = `${tr('answerIs')}${q.answer}`;
    }

    function getDifficultyValue(selectId) {
      const value = $(selectId)?.value || 'easy';
      const map = { easy: 3, normal: 6, hard: 10, devil: 18 };
      return map[value] || 3;
    }

    function createCalcQuestion(type = 'calc') {
      const level = $(type === 'ultimate' ? 'diffUltimate' : 'diffCalc').value;
      let q = '';
      let answer = 0;

      if (level === 'easy') {
        const a = randomInt(6, 30);
        const b = randomInt(2, 20);
        q = `${a} + ${b} = ?`;
        answer = a + b;
      } else if (level === 'normal') {
        const a = randomInt(5, 25);
        const b = randomInt(2, 12);
        q = `${a} × ${b} = ?`;
        answer = a * b;
      } else if (level === 'hard') {
        const a = randomInt(10, 60);
        const b = randomInt(2, 12);
        const c = randomInt(3, 18);
        q = `${a} + ${b} × ${c} = ?`;
        answer = a + b * c;
      } else {
        const a = randomInt(12, 60);
        const b = randomInt(2, 18);
        const c = randomInt(2, 12);
        q = `(${a} - ${b}) × ${c} = ?`;
        answer = (a - b) * c;
      }

      state.questions[type] = { q, answer };
      const qEl = type === 'ultimate' ? $('qUltimate') : $('qCalc');
      const ansEl = type === 'ultimate' ? $('ansUltimate') : $('ansCalc');
      const showEl = type === 'ultimate' ? $('showUltimateAnswer') : $('showCalcAnswer');
      const msgEl = type === 'ultimate' ? 'msgUltimate' : 'msgCalc';
      qEl.textContent = `Question: ${q}`;
      ansEl.value = '';
      showEl.textContent = '';
      setStatus(msgEl, '', '');
      const timerKey = type === 'ultimate' ? 'ultimate' : 'calc';
      startTimer(timerKey, 18, () => {
        if (state.page !== (type === 'ultimate' ? 'pageUltimate' : 'pageCalc')) return;
        setStatus(msgEl, tr('timeUp'), 'error');
        markProgress(type, 'wrong');
        state.retryQueue.push({ type, payload: state.questions[type] });
      });
    }

    function submitNumeric(type) {
      const q = state.questions[type];
      if (!q) return;
      const inputId = type === 'ultimate' ? 'ansUltimate' : type === 'calc' ? 'ansCalc' : 'ansWord';
      const msgId = type === 'ultimate' ? 'msgUltimate' : type === 'calc' ? 'msgCalc' : 'msgWord';
      const diffId = type === 'ultimate' ? 'diffUltimate' : type === 'calc' ? 'diffCalc' : 'diffWord';
      const raw = $(inputId).value.trim();
      const value = Number(raw);
      if (!raw || !Number.isFinite(value)) {
        setStatus(msgId, tr('invalid'), 'error');
        return;
      }
      if (Math.abs(value - q.answer) < 1e-8) {
        setStatus(msgId, tr('correct'), 'success');
        addPoints(type, getDifficultyValue(diffId));
        markProgress(type, 'correct');
        playTone('correct');
        clearTimer(type);
        setTimeout(() => createCalcQuestion(type), 700);
      } else {
        setStatus(msgId, tr('wrong'), 'error');
        markProgress(type, 'wrong');
        state.retryQueue.push({ type, payload: q });
        playTone('wrong');
      }
    }

    function showNumericAnswer(type) {
      const q = state.questions[type];
      if (!q) return;
      const el = type === 'ultimate' ? $('showUltimateAnswer') : type === 'calc' ? $('showCalcAnswer') : $('showWordAnswer');
      if (el) el.textContent = `${tr('answerIs')}${q.answer}`;
    }

    function createWordQuestion() {
      const level = $('diffWord').value;
      let q = '';
      let answer = 0;

      if (level === 'easy') {
        const a = randomInt(8, 30);
        const b = randomInt(5, 20);
        q = `A has ${a} books and B has ${b} more. Total books?`;
        answer = a + b;
      } else if (level === 'normal') {
        const a = randomInt(3, 20);
        const b = randomInt(4, 30);
        q = `A rectangle is ${a} by ${b}. What is the area?`;
        answer = a * b;
      } else if (level === 'hard') {
        const head = randomInt(16, 45);
        const feet = randomInt(30, 90);
        const rabbits = (feet - 2 * head) / 2;
        q = `There are ${head} heads and ${feet} legs. How many rabbits?`;
        answer = rabbits;
      } else {
        const a = randomInt(6, 24);
        const b = randomInt(5, 20);
        q = `Two people walk toward each other at ${a} and ${b} m/min. After ${a + b} m, when do they meet?`;
        answer = (a + b) / (a + b);
      }

      state.questions.word = { q, answer };
      $('qWord').textContent = `Question: ${q}`;
      $('ansWord').value = '';
      $('showWordAnswer').textContent = '';
      setStatus('msgWord', '', '');
      startTimer('word', 20, () => {
        if (state.page !== 'pageWord') return;
        setStatus('msgWord', tr('timeUp'), 'error');
        markProgress('word', 'wrong');
        state.retryQueue.push({ type: 'word', payload: state.questions.word });
      });
    }

    function handleWordSubmit() {
      const q = state.questions.word;
      if (!q) return;
      const value = Number($('ansWord').value);
      if (!Number.isFinite(value)) {
        setStatus('msgWord', tr('invalid'), 'error');
        return;
      }
      if (Math.abs(value - q.answer) < 1e-8) {
        setStatus('msgWord', tr('correct'), 'success');
        addPoints('word', getDifficultyValue('diffWord'));
        markProgress('word', 'correct');
        playTone('correct');
        clearTimer('word');
        setTimeout(createWordQuestion, 700);
      } else {
        setStatus('msgWord', tr('wrong'), 'error');
        markProgress('word', 'wrong');
        state.retryQueue.push({ type: 'word', payload: q });
        playTone('wrong');
      }
    }

    function createSudokuBoard() {
      const board = $('sudokuBoard');
      board.innerHTML = '';
      const puzzle = [
        [5, 3, 0, 0, 7, 0, 0, 0, 0],
        [6, 0, 0, 1, 9, 5, 0, 0, 0],
        [0, 9, 8, 0, 0, 0, 0, 6, 0],
        [8, 0, 0, 0, 6, 0, 0, 0, 3],
        [4, 0, 0, 8, 0, 3, 0, 0, 1],
        [7, 0, 0, 0, 2, 0, 0, 0, 6],
        [0, 6, 0, 0, 0, 0, 2, 8, 0],
        [0, 0, 0, 4, 1, 9, 0, 0, 5],
        [0, 0, 0, 0, 8, 0, 0, 7, 9]
      ];
      state.questions.sudoku = { board: puzzle.map(r => r.slice()) };
      for (let row = 0; row < 9; row++) {
        for (let col = 0; col < 9; col++) {
          const input = document.createElement('input');
          input.type = 'text';
          input.maxLength = 1;
          input.className = 'sudoku-cell';
          input.value = puzzle[row][col] ? String(puzzle[row][col]) : '';
          if (puzzle[row][col]) input.classList.add('fixed');
          input.disabled = !!puzzle[row][col];
          input.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^1-9]/g, '').slice(0, 1);
          });
          board.appendChild(input);
        }
      }
      setStatus('msgSudoku', tr('sudokuRule'), 'info');
      startTimer('sudoku', 50, () => {
        if (state.page !== 'pageSudoku') return;
        setStatus('msgSudoku', tr('timeUp'), 'error');
        markProgress('sudoku', 'wrong');
      });
    }

    function collectSudokuValues() {
      const cells = [...document.querySelectorAll('.sudoku-cell')];
      return cells.map(cell => {
        const value = cell.value.trim();
        return value ? Number(value) : 0;
      });
    }

    function isSudokuSolved(values) {
      const okSet = (arr) => new Set(arr).size === 9 && arr.every(n => n >= 1 && n <= 9);
      for (let r = 0; r < 9; r++) {
        const row = [];
        for (let c = 0; c < 9; c++) row.push(values[r * 9 + c]);
        if (!okSet(row)) return false;
      }
      for (let c = 0; c < 9; c++) {
        const col = [];
        for (let r = 0; r < 9; r++) col.push(values[r * 9 + c]);
        if (!okSet(col)) return false;
      }
      for (let br = 0; br < 9; br += 3) {
        for (let bc = 0; bc < 9; bc += 3) {
          const box = [];
          for (let r = br; r < br + 3; r++) {
            for (let c = bc; c < bc + 3; c++) box.push(values[r * 9 + c]);
          }
          if (!okSet(box)) return false;
        }
      }
      return true;
    }

    function checkSudoku() {
      const values = collectSudokuValues();
      if (values.some(v => v === 0)) {
        setStatus('msgSudoku', tr('sudokuIncomplete'), 'error');
        return;
      }
      if (!isSudokuSolved(values)) {
        setStatus('msgSudoku', tr('sudokuWrong'), 'error');
        markProgress('sudoku', 'wrong');
        state.retryQueue.push({ type: 'sudoku', payload: state.questions.sudoku });
        playTone('wrong');
        return;
      }
      setStatus('msgSudoku', tr('sudokuCorrect'), 'success');
      addPoints('sudoku', getDifficultyValue('diffSudoku'));
      markProgress('sudoku', 'correct');
      playTone('correct');
      clearTimer('sudoku');
      setTimeout(createSudokuBoard, 850);
    }

    function renderPlayers() {
      const box = $('multiPlayers');
      if (!box) return;
      box.innerHTML = '';
      state.players.forEach((player) => {
        const row = document.createElement('div');
        row.className = 'player-row';
        const head = document.createElement('div');
        head.className = 'player-head';
        const left = document.createElement('span');
        left.textContent = player.name;
        const right = document.createElement('span');
        right.textContent = `${tr('score')}: ${player.score}`;
        head.appendChild(left);
        head.appendChild(right);
        const bar = document.createElement('div');
        bar.className = 'mini-bar';
        const fill = document.createElement('div');
        fill.className = 'mini-fill';
        fill.style.width = `${player.progress || 0}%`;
        bar.appendChild(fill);
        row.appendChild(head);
        row.appendChild(bar);
        box.appendChild(row);
      });
    }

    function addBot() {
      if (state.players.length >= 5) return;
      state.players.push({ name: `${tr('bot')} ${state.players.length}`, score: 0, progress: 0, bot: true });
      renderPlayers();
    }

    function clearPlayersList() {
      state.players = [{ name: state.playerName || tr('you'), score: 0, progress: 0, bot: false }];
      state.multiRunning = false;
      state.multiQuestions = [];
      state.multiIndex = 0;
      $('multiQuestion').textContent = 'Question: --';
      $('multiAns').value = '';
      $('rankBox').classList.add('hidden');
      renderPlayers();
      setStatus('msgMulti', '', '');
      clearTimer('multi');
    }

    function startMultiGame() {
      if (!state.players.length) {
        setStatus('msgMulti', tr('noPlayers'), 'error');
        return;
      }
      state.multiRunning = true;
      state.multiIndex = 0;
      state.multiQuestions = Array.from({ length: 5 }, () => {
        const a = randomInt(8, 50);
        const b = randomInt(2, 20);
        return { q: `${a} + ${b} = ?`, answer: a + b };
      });
      state.players.forEach((p) => {
        p.score = 0;
        p.progress = 0;
      });
      renderPlayers();
      showMultiQuestion();
    }

    function showMultiQuestion() {
      if (!state.multiRunning) return;
      if (state.multiIndex >= state.multiQuestions.length) {
        finishMulti();
        return;
      }
      const q = state.multiQuestions[state.multiIndex];
      $('multiQuestion').textContent = `Question ${state.multiIndex + 1}: ${q.q}`;
      $('multiAns').value = '';
      $('rankBox').classList.add('hidden');
      clearTimer('multi');
      startTimer('multi', 18, () => {
        if (!state.multiRunning) return;
        setStatus('msgMulti', tr('timeUp'), 'error');
        state.multiIndex++;
        markProgress('multi', 'wrong');
        if (state.multiIndex >= state.multiQuestions.length) finishMulti();
        else setTimeout(showMultiQuestion, 650);
      });
    }

    function finishMulti() {
      state.multiRunning = false;
      const sorted = [...state.players].sort((a, b) => b.score - a.score);
      $('multiQuestion').textContent = tr('finalRank');
      const rankBox = $('rankBox');
      rankBox.innerHTML = '';
      rankBox.classList.remove('hidden');
      const head = document.createElement('h3');
      head.textContent = tr('finalRank');
      rankBox.appendChild(head);
      sorted.forEach((p, idx) => {
        const row = document.createElement('div');
        row.textContent = `${idx + 1}. ${p.name} - ${p.score}`;
        rankBox.appendChild(row);
      });
      clearTimer('multi');
      addLeaderboardEntry(state.playerName || tr('you'), state.totalScore);
    }

    function submitMulti() {
      if (!state.multiRunning) {
        setStatus('msgMulti', tr('noPlayers'), 'error');
        return;
      }
      const q = state.multiQuestions[state.multiIndex];
      if (!q) return;
      const value = Number($('multiAns').value);
      if (!Number.isFinite(value)) {
        setStatus('msgMulti', tr('invalid'), 'error');
        return;
      }
      const player = state.players[0];
      if (Math.abs(value - q.answer) < 1e-8) {
        player.score += 10;
        state.totalScore += 10;
        state.scores.multi = (state.scores.multi || 0) + 10;
        player.progress = ((state.multiIndex + 1) / state.multiQuestions.length) * 100;
        setStatus('msgMulti', tr('correct'), 'success');
        markProgress('multi', 'correct');
        playTone('correct');
        updateScores();
        saveState();
      } else {
        setStatus('msgMulti', tr('wrong'), 'error');
        markProgress('multi', 'wrong');
        playTone('wrong');
      }
      renderPlayers();
      clearTimer('multi');
      state.multiIndex++;
      setTimeout(showMultiQuestion, 600);
    }

    function playTone(type = 'correct') {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type === 'wrong' ? 'square' : 'sine';
      osc.frequency.value = type === 'wrong' ? 180 : 620;
      gain.gain.value = 0.06;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
      setTimeout(() => ctx.close(), 200);
    }

    function startTimer(key, seconds, onTimeout) {
      clearInterval(state.timers[key]);
      const label = $('timer' + (key.charAt(0).toUpperCase() + key.slice(1)));
      if (label) label.textContent = `${seconds}s`;
      const start = Date.now();
      state.timers[key] = setInterval(() => {
        const elapsed = Math.floor((Date.now() - start) / 1000);
        const left = Math.max(0, seconds - elapsed);
        if (label) label.textContent = `${left}s`;
        if (left <= 0) {
          clearInterval(state.timers[key]);
          if (onTimeout) onTimeout();
        }
      }, 250);
    }

    function clearTimer(key) {
      clearInterval(state.timers[key]);
      const label = $('timer' + (key.charAt(0).toUpperCase() + key.slice(1)));
      if (label) label.textContent = '';
    }

    function handleRetryQueue() {
      const next = state.retryQueue.shift();
      if (!next) {
        setStatus('msg24', tr('noRetry'), 'info');
        return;
      }
      const { type, payload } = next;
      if (type === 'game24') {
        showPage('page24');
        state.questions.game24 = payload;
        $('q24').textContent = `Numbers: ${payload.nums.join('  ')}`;
        $('ans24').value = '';
        setStatus('msg24', tr('retryQueue'), 'info');
        startTimer('game24', 20, () => {
          if (state.page !== 'page24') return;
          setStatus('msg24', tr('timeUp'), 'error');
          markProgress('game24', 'wrong');
          state.retryQueue.push({ type: 'game24', payload: state.questions.game24 });
        });
      } else if (type === 'calc' || type === 'ultimate') {
        const isUltimate = type === 'ultimate';
        showPage(isUltimate ? 'pageUltimate' : 'pageCalc');
        state.questions[type] = payload;
        createCalcQuestion(type);
        setStatus(isUltimate ? 'msgUltimate' : 'msgCalc', tr('retryQueue'), 'info');
      } else if (type === 'word') {
        showPage('pageWord');
        state.questions.word = payload;
        $('qWord').textContent = `Question: ${payload.q}`;
        $('ansWord').value = '';
        setStatus('msgWord', tr('retryQueue'), 'info');
        startTimer('word', 20, () => {
          if (state.page !== 'pageWord') return;
          setStatus('msgWord', tr('timeUp'), 'error');
          markProgress('word', 'wrong');
          state.retryQueue.push({ type: 'word', payload: state.questions.word });
        });
      } else if (type === 'sudoku') {
        showPage('pageSudoku');
        createSudokuBoard();
        setStatus('msgSudoku', tr('retryQueue'), 'info');
      }
    }

    function setLanguage(lang) {
      state.lang = lang;
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach((el) => {
        const key = el.dataset.i18n;
        if (T[lang][key]) el.textContent = T[lang][key];
      });
      $('playerName').placeholder = tr('playerName');
      $('playerId').placeholder = tr('playerId');
      $('ans24').placeholder = 'Use + - * / ( )';
      $('ansCalc').placeholder = 'Enter answer';
      $('ansWord').placeholder = 'Enter answer';
      $('multiAns').placeholder = 'Enter answer';
      $('ansUltimate').placeholder = 'Enter answer';
      saveState();
    }

    function fillSelects() {
      const options = [
        { value: 'easy', label: tr('easy') },
        { value: 'normal', label: tr('normal') },
        { value: 'hard', label: tr('hard') },
        { value: 'devil', label: tr('devil') }
      ];
      ['diff24', 'diffCalc', 'diffWord', 'diffSudoku', 'diffUltimate'].forEach((id) => {
        const sel = $(id);
        if (!sel) return;
        sel.innerHTML = options.map(opt => `<option value="${opt.value}">${opt.label}</option>`).join('');
      });
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach((page) => {
        page.classList.toggle('active', page.id === pageId);
      });
      state.page = pageId;
    }

    function bindEvents() {
      document.querySelectorAll('[data-page]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const page = btn.dataset.page;
          if (page === 'pageUltimate' && state.totalScore < UNLOCK_TOTAL) {
            setStatus('msgUltimate', tr('need40'), 'error');
            return;
          }
          showPage(page);
          if (page === 'page24') create24Question();
          if (page === 'pageCalc') createCalcQuestion('calc');
          if (page === 'pageWord') createWordQuestion();
          if (page === 'pageSudoku') createSudokuBoard();
          if (page === 'pageUltimate') createCalcQuestion('ultimate');
        });
      });

      document.querySelectorAll('[data-back]').forEach((btn) => {
        btn.addEventListener('click', () => showPage('homePage'));
      });

      $('langBtn').addEventListener('click', () => {
        $('langMenu').classList.toggle('open');
        $('langBtn').setAttribute('aria-expanded', $('langMenu').classList.contains('open'));
      });

      document.addEventListener('click', (event) => {
        if (!event.target.closest('.lang-wrap')) {
          $('langMenu').classList.remove('open');
        }
      });

      $('playerName').addEventListener('input', (e) => {
        state.playerName = e.target.value.slice(0, 24);
        if (state.players[0]) state.players[0].name = state.playerName || tr('you');
        renderPlayers();
        saveState();
      });

      $('playerId').addEventListener('input', (e) => {
        state.playerId = e.target.value.slice(0, 20);
        saveState();
      });

      $('submit24Btn').addEventListener('click', handle24Submit);
      $('next24Btn').addEventListener('click', create24Question);
      $('show24Btn').addEventListener('click', show24Answer);
      $('submitCalcBtn').addEventListener('click', () => submitNumeric('calc'));
      $('nextCalcBtn').addEventListener('click', () => createCalcQuestion('calc'));
      $('showCalcBtn').addEventListener('click', () => showNumericAnswer('calc'));
      $('submitWordBtn').addEventListener('click', handleWordSubmit);
      $('nextWordBtn').addEventListener('click', createWordQuestion);
      $('showWordBtn').addEventListener('click', () => showNumericAnswer('word'));
      $('checkSudokuBtn').addEventListener('click', checkSudoku);
      $('newSudokuBtn').addEventListener('click', createSudokuBoard);
      $('retrySudokuBtn').addEventListener('click', handleRetryQueue);
      $('addBotBtn').addEventListener('click', addBot);
      $('clearPlayersBtn').addEventListener('click', clearPlayersList);
      $('startMultiBtn').addEventListener('click', startMultiGame);
      $('submitMultiBtn').addEventListener('click', submitMulti);
      $('retryMultiBtn').addEventListener('click', handleRetryQueue);
      $('submitUltimateBtn').addEventListener('click', () => submitNumeric('ultimate'));
      $('nextUltimateBtn').addEventListener('click', () => createCalcQuestion('ultimate'));
      $('showUltimateBtn').addEventListener('click', () => showNumericAnswer('ultimate'));

      ['diff24', 'diffCalc', 'diffWord', 'diffSudoku', 'diffUltimate'].forEach((id) => {
        $(id)?.addEventListener('change', () => {
          if (id === 'diff24' && state.page === 'page24') create24Question();
          if (id === 'diffCalc' && state.page === 'pageCalc') createCalcQuestion('calc');
          if (id === 'diffWord' && state.page === 'pageWord') createWordQuestion();
          if (id === 'diffSudoku' && state.page === 'pageSudoku') createSudokuBoard();
          if (id === 'diffUltimate' && state.page === 'pageUltimate') createCalcQuestion('ultimate');
        });
      });
    }

    function initLangMenu() {
      const menu = $('langMenu');
      menu.innerHTML = '';
      Object.entries(LANGS).forEach(([code, label]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'lang-option';
        btn.textContent = label;
        btn.addEventListener('click', () => {
          setLanguage(code);
          menu.classList.remove('open');
        });
        menu.appendChild(btn);
      });
    }

    function bootstrap() {
      loadState();
      initLangMenu();
      fillSelects();
      bindEvents();
      $('playerName').value = state.playerName;
      $('playerId').value = state.playerId;
      state.players[0].name = state.playerName || tr('you');
      setLanguage(state.lang);
      updateScores();
      renderLeaderboard();
      renderPlayers();
      updateGlobalProgress();
      create24Question();
      createCalcQuestion('calc');
      createWordQuestion();
      createSudokuBoard();
      createCalcQuestion('ultimate');
      showPage('homePage');
      saveState();
    }

    bootstrap();
  </script>
</body>
</html>
