<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Puzzle Park</title>
  <style>
    :root{--bg1:#eef4ff;--bg2:#eefaf4;--card:#fff;--line:#e6ebf3;--text:#1d2a3a;--muted:#63758b;--primary:#4d6ef3;--green:#22b66d;--red:#ea5a55;--gold:#a86d00;--shadow:0 16px 36px rgba(24,41,72,.10)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100vh;background:linear-gradient(140deg,var(--bg1),var(--bg2));color:var(--text);font-family:"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif}body{overflow-x:hidden}.app{max-width:1220px;margin:0 auto;padding:22px}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.9);border-radius:20px;box-shadow:var(--shadow);padding:14px 18px;position:sticky;top:10px;z-index:20;backdrop-filter:blur(10px)}.brand{font-size:clamp(1.6rem,2vw,2.2rem);font-weight:900;letter-spacing:.03em}.top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.pill{min-width:145px;text-align:center;padding:10px 14px;border:1px solid #f1d289;border-radius:14px;background:#fff9ea;color:var(--gold);font-weight:800;white-space:nowrap}.timer-pill{min-width:84px;background:#fff;border-color:var(--line);color:var(--text)}.timer-pill.urgent{color:var(--red);border-color:#f0aaa6}.lang-wrap{position:relative}.lang-btn{min-width:118px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:10px 14px;font-size:.98rem;font-weight:700;cursor:pointer}.lang-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:170px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:none;z-index:30}.lang-menu.open{display:grid}.lang-option{border:0;background:#fff;text-align:left;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--text);font-weight:600}.lang-option:hover{background:#f3f6ff}
    .page{display:none}.page.active{display:block;animation:fade .2s ease}@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.card{padding:24px;border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:var(--shadow)}.home-head,.panel-header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}.title{margin:0;font-size:clamp(2rem,4vw,3rem);font-weight:900}.player-box{display:flex;gap:16px;flex-wrap:wrap;background:linear-gradient(135deg,#f9fbff,#f2f6ff);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:20px}.field{flex:1;min-width:220px;display:flex;flex-direction:column;gap:7px}.field label,.difficulty label{color:var(--muted);font-weight:700}.field input,.answer-input,.difficulty select{width:100%;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1rem;outline:none}.field input:focus,.answer-input:focus,.difficulty select:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(77,110,243,.08)}.game-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.game-btn{width:100%;min-height:88px;border:0;border-radius:18px;color:#fff;font-size:1.04rem;font-weight:800;cursor:pointer;box-shadow:0 10px 20px rgba(26,45,90,.12);transition:transform .15s,filter .15s}.game-btn:hover{transform:translateY(-2px);filter:brightness(1.04)}.btn-blue{background:linear-gradient(135deg,#5575ff,#7d94ff)}.btn-green{background:linear-gradient(135deg,#22b66d,#33d188)}.btn-orange{background:linear-gradient(135deg,#f39a2c,#ffbb5c)}.btn-purple{background:linear-gradient(135deg,#815ef1,#aa82ff)}.btn-red{background:linear-gradient(135deg,#eb5a5a,#ff7f7b)}.btn-gold{background:linear-gradient(135deg,#cf931b,#efbe53)}
    .header-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.back-btn,.action-btn,.soft-btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;color:#fff}.back-btn{background:linear-gradient(135deg,#eb5a5a,#ff7b7b)}.action-btn.btn-green{background:linear-gradient(135deg,#1caf69,#2ad97d)}.action-btn.btn-blue{background:linear-gradient(135deg,#5575ff,#7d94ff)}.action-btn.btn-orange{background:linear-gradient(135deg,#ef9b30,#ffbd5d)}.action-btn.btn-red{background:linear-gradient(135deg,#eb5a5a,#ff7b7b)}.soft-btn{background:linear-gradient(135deg,#edf3ff,#eff5ff);color:var(--primary)}.mini-score{background:#fff9ea;border:1px solid #f1d089;border-radius:12px;padding:10px 12px;color:var(--gold);font-weight:800}.difficulty{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.difficulty select{min-width:190px}.question-box{min-height:90px;margin:15px 0 12px;padding:18px 16px;border:1px solid #e4ebff;background:#f8faff;border-radius:16px;font-size:clamp(1.1rem,2vw,1.4rem);line-height:1.55;font-weight:800;white-space:pre-wrap;word-break:break-word}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.status{min-height:26px;margin-top:12px;font-weight:800}.status.success{color:var(--green)}.status.error{color:var(--red)}.status.info{color:var(--primary)}
    .progress-mini{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:5px;margin:12px 0 8px;align-items:center}.dot{width:100%;aspect-ratio:1;border-radius:50%;background:#fff;border:1.5px solid #dfe7f3}.dot.correct{background:var(--green);border-color:#1ea764}.dot.wrong{background:var(--red);border-color:#d74e48}.leaderboard{margin-top:18px;padding:16px;border-radius:16px;background:#f8faff;border:1px solid var(--line)}.leaderboard h3{margin:0 0 8px}.leaderboard-list{display:grid;gap:7px}.multi-list{display:grid;gap:10px;margin:16px 0}.player-row{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff}.player-head{display:flex;justify-content:space-between;gap:8px;font-weight:800;margin-bottom:8px}.mini-bar{height:8px;background:#edf0f6;border-radius:999px;overflow:hidden}.mini-fill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),#3bc9a8);border-radius:inherit;transition:width .2s}.hidden{display:none!important}.sudoku-board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;max-width:430px;margin:16px auto;padding:7px;border:2px solid #ced9ee;border-radius:14px;background:#f7f9ff}.sudoku-cell{width:100%;aspect-ratio:1;border:1px solid #dfe7f2;border-radius:5px;background:#fff;text-align:center;font-size:1rem;font-weight:800;color:var(--text);outline:none}.sudoku-cell.fixed{background:#eef3ff;color:var(--muted)}
    @media(max-width:700px){.app{padding:12px}.topbar{padding:11px 12px}.top-actions{gap:7px}.pill{min-width:auto;padding:9px 10px}.game-grid{grid-template-columns:1fr 1fr}.card{padding:16px}.progress-mini{gap:3px}.dot{border-width:1px}.difficulty{width:100%}.difficulty select{flex:1;min-width:0}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand" data-i18n="brand">数学乐园</div>
      <div class="top-actions">
        <div class="pill"><span data-i18n="totalScore">总积分</span>: <strong id="topScore">0</strong></div>
        <div class="pill timer-pill" id="timerPill" aria-live="polite"><span id="topTimer">40s</span></div>
        <div class="lang-wrap"><button class="lang-btn" id="langBtn" type="button" aria-expanded="false"><span data-i18n="language">语言</span> ▾</button><div class="lang-menu" id="langMenu" aria-label="Language menu"></div></div>
      </div>
    </header>

    <main>
      <section class="page active" id="homePage">
        <div class="home-head"><h1 class="title" data-i18n="homeTitle">数学益智乐园</h1><div class="pill"><span data-i18n="totalScore">总积分</span>: <strong id="homeScore">0</strong></div></div>
        <div class="card">
          <div class="player-box">
            <div class="field"><label data-i18n="playerName">玩家名字</label><input id="playerName" maxlength="24" type="text" placeholder="请输入名字"></div>
            <div class="field"><label data-i18n="playerId">玩家 ID</label><input id="playerId" maxlength="20" type="text" placeholder="自定义 ID"></div>
          </div>
          <div class="game-grid">
            <button class="game-btn btn-blue" data-page="page24" data-i18n="game24">24 点</button>
            <button class="game-btn btn-green" data-page="pageCalc" data-i18n="gameCalc">口算</button>
            <button class="game-btn btn-orange" data-page="pageWord" data-i18n="gameWord">应用题</button>
            <button class="game-btn btn-purple" data-page="pageSudoku" data-i18n="gameSudoku">数独</button>
            <button class="game-btn btn-red" data-page="pageMulti" data-i18n="gameMulti">多人 BOT 对战</button>
            <button class="game-btn btn-gold" data-page="pageUltimate" id="ultimateBtn" data-i18n="ultimateBtn">终极测试（40分解锁）</button>
          </div>
          <div class="leaderboard"><h3 data-i18n="rankTitle">排行榜</h3><div class="leaderboard-list" id="leaderboardList"></div></div>
        </div>
      </section>

      <section class="page" id="page24">
        <div class="panel-header"><div class="header-left"><button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button><div class="mini-score"><span data-i18n="singleScore">单项积分</span>: <strong id="score24">0</strong></div></div><div class="difficulty"><label data-i18n="difficulty">难度</label><select id="diff24"></select></div></div>
        <div class="card"><div class="progress-mini" id="progress24"></div><div class="question-box" id="q24">题目：--</div><input class="answer-input" id="ans24" type="text" data-placeholder="formulaPlaceholder"><div class="controls"><button class="action-btn btn-green" id="submit24Btn" data-i18n="submitBtn">提交答案</button><button class="action-btn btn-blue" id="next24Btn" data-i18n="nextBtn">下一题</button><button class="action-btn btn-orange" id="show24Btn" data-i18n="showAnswerBtn">查看答案</button></div><div class="status" id="msg24"></div><div class="status info" id="show24Answer"></div></div>
      </section>

      <section class="page" id="pageCalc">
        <div class="panel-header"><div class="header-left"><button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button><div class="mini-score"><span data-i18n="singleScore">单项积分</span>: <strong id="scoreCalc">0</strong></div></div><div class="difficulty"><label data-i18n="difficulty">难度</label><select id="diffCalc"></select></div></div>
        <div class="card"><div class="progress-mini" id="progressCalc"></div><div class="question-box" id="qCalc">题目：--</div><input class="answer-input" id="ansCalc" type="number" step="any" data-placeholder="answerPlaceholder"><div class="controls"><button class="action-btn btn-green" id="submitCalcBtn" data-i18n="submitBtn">提交答案</button><button class="action-btn btn-blue" id="nextCalcBtn" data-i18n="nextBtn">下一题</button><button class="action-btn btn-orange" id="showCalcBtn" data-i18n="showAnswerBtn">查看答案</button></div><div class="status" id="msgCalc"></div><div class="status info" id="showCalcAnswer"></div></div>
      </section>

      <section class="page" id="pageWord">
        <div class="panel-header"><div class="header-left"><button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button><div class="mini-score"><span data-i18n="singleScore">单项积分</span>: <strong id="scoreWord">0</strong></div></div><div class="difficulty"><label data-i18n="difficulty">难度</label><select id="diffWord"></select></div></div>
        <div class="card"><div class="progress-mini" id="progressWord"></div><div class="question-box" id="qWord">题目：--</div><input class="answer-input" id="ansWord" type="number" step="any" data-placeholder="answerPlaceholder"><div class="controls"><button class="action-btn btn-green" id="submitWordBtn" data-i18n="submitBtn">提交答案</button><button class="action-btn btn-blue" id="nextWordBtn" data-i18n="nextBtn">下一题</button><button class="action-btn btn-orange" id="showWordBtn" data-i18n="showAnswerBtn">查看答案</button></div><div class="status" id="msgWord"></div><div class="status info" id="showWordAnswer"></div></div>
      </section>

      <section class="page" id="pageSudoku">
        <div class="panel-header"><div class="header-left"><button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button><div class="mini-score"><span data-i18n="singleScore">单项积分</span>: <strong id="scoreSudoku">0</strong></div></div><div class="difficulty"><label data-i18n="difficulty">难度</label><select id="diffSudoku"></select></div></div>
        <div class="card"><div class="progress-mini" id="progressSudoku"></div><div class="sudoku-board" id="sudokuBoard"></div><div class="controls"><button class="action-btn btn-green" id="checkSudokuBtn" data-i18n="checkBtn">检查答案</button><button class="action-btn btn-blue" id="newSudokuBtn" data-i18n="newSudokuBtn">新数独</button></div><div class="status" id="msgSudoku"></div></div>
      </section>

      <section class="page" id="pageMulti">
        <div class="panel-header"><div class="header-left"><button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button><div class="mini-score" data-i18n="botMatch">BOT 对战</div></div></div>
        <div class="card">
          <div class="controls" style="margin-top:0">
            <div class="difficulty"><label data-i18n="questionType">题型</label><select id="multiType"></select></div>
            <div class="difficulty"><label data-i18n="difficulty">难度</label><select id="multiDifficulty"></select></div>
          </div>
          <div class="controls"><button class="action-btn btn-blue" id="addBotBtn" data-i18n="addBotBtn">添加 Bot</button><button class="action-btn btn-red" id="clearPlayersBtn" data-i18n="clearBtn">清空</button><button class="action-btn btn-green" id="startMultiBtn" data-i18n="startBtn">开始</button></div>
          <div class="multi-list" id="multiPlayers"></div>
          <div class="progress-mini" id="progressMulti"></div>
          <div class="question-box" id="multiQuestion">题目：--</div>
          <input class="answer-input" id="multiAns" type="number" step="any" data-placeholder="answerPlaceholder">
          <div class="controls"><button class="action-btn btn-green" id="submitMultiBtn" data-i18n="submitBtn">提交答案</button><button class="action-btn btn-blue" id="nextMultiBtn" data-i18n="nextBtn">下一题</button></div>
          <div class="status" id="msgMulti"></div>
          <div class="leaderboard hidden" id="rankBox"></div>
        </div>
      </section>

      <section class="page" id="pageUltimate">
        <div class="panel-header"><div class="header-left"><button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button><div class="mini-score"><span data-i18n="ultimateScore">终极测试</span>: <strong id="scoreUltimate">0</strong></div></div><div class="difficulty"><label data-i18n="difficulty">难度</label><select id="diffUltimate" disabled aria-label="Hardest difficulty"></select></div></div>
        <div class="card"><div class="progress-mini" id="progressUltimate"></div><div class="question-box" id="qUltimate">题目：--</div><input class="answer-input" id="ansUltimate" type="number" step="any" data-placeholder="answerPlaceholder"><div class="controls"><button class="action-btn btn-green" id="submitUltimateBtn" data-i18n="submitBtn">提交答案</button><button class="action-btn btn-blue" id="nextUltimateBtn" data-i18n="nextBtn">下一题</button><button class="action-btn btn-orange" id="showUltimateBtn" data-i18n="showAnswerBtn">查看答案</button></div><div class="status" id="msgUltimate"></div><div class="status info" id="showUltimateAnswer"></div></div>
      </section>
    </main>
  </div>

  <script>
    const SAVE_KEY='mathgame_park_v1';
    const LANGS={zh:'中文',en:'English',es:'Español',ja:'日本語',ko:'한국어',fr:'Français'};

    const state={lang:'zh',totalScore:0,scores:{game24:0,calc:0,word:0,sudoku:0,multi:0,ultimate:0},playerName:'',playerId:'',progress:{game24:[],calc:[],word:[],sudoku:[],multi:[],ultimate:[]},questions:{},timerId:null,timeLeft:40,activeMode:null,answered:{},players:[],multiRound:0,multiActive:false};

    function fillSelects(){const optionHtml=LEVELS.map(level=>`<option value="${level}">${tr(level)}</option>`).join('');['diff24','diffCalc','diffWord','diffSudoku','multiDifficulty'].forEach(id=>{const e=$(id);if(!e)return;const old=e.value;e.innerHTML=optionHtml;e.value=LEVELS.includes(old)?old:'devil'});const u=$('diffUltimate');u.innerHTML=`<option value="devil">${tr('devil')}</option>`;u.value='devil';u.disabled=true;const type=$('multiType');if(type){const old=type.value;type.innerHTML=[['game24','type24'],['calc','typeCalc'],['word','typeWord']].map(([v,k])=>`<option value="${v}">${tr(k)}</option>`).join('');type.value=['game24','calc','word'].includes(old)?old:'calc'}}
    function updateScores(){ $('topScore').textContent=state.totalScore;$('homeScore').textContent=state.totalScore;[['score24','game24'],['scoreCalc','calc'],['scoreWord','word'],['scoreSudoku','sudoku'],['scoreUltimate','ultimate']].forEach(([id,key])=>$(id).textContent=state.scores[key]||0);$('ultimateBtn').disabled=state.totalScore<40;$('ultimateBtn').style.opacity=state.totalScore<40?'.55':'1'}
    function renderProgress(mode){const e=$('progress'+({game24:'24',calc:'Calc',word:'Word',sudoku:'Sudoku',multi:'Multi',ultimate:'Ultimate'}[mode]));if(!e)return;e.innerHTML='';const vals=state.progress[mode].slice(-20);for(let i=0;i<20;i++){const d=document.createElement('div');d.className='dot '+(vals[i]||'empty');e.appendChild(d)}}

    function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
    function modeIds(mode){return {game24:['q24','ans24','msg24','show24Answer'],calc:['qCalc','ansCalc','msgCalc','showCalcAnswer'],word:['qWord','ansWord','msgWord','showWordAnswer'],ultimate:['qUltimate','ansUltimate','msgUltimate','showUltimateAnswer'] }[mode]}
    function setQuestion(mode,text,answer,displayAnswer=answer){state.questions[mode]={answer,displayAnswer,text};const [qid,aid,mid,sid]=modeIds(mode);$(qid).textContent=text;$(aid).value='';setStatus(mid,'');$(sid).textContent='';state.answered[mode]=false;startTimer(mode)}
    function create24(){let nums,answer;do{nums=[randomInt(1,13),randomInt(1,13),randomInt(1,13),randomInt(1,13)];answer=solve24(nums)}while(!answer);setQuestion('game24',`题目：${nums.join('  ')} → 24`,24,answer)}
    function solve24(nums){function rec(items){if(items.length===1)return Math.abs(items[0].v-24)<1e-8?items[0].e:null;for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j],rest=items.filter((_,k)=>k!==i&&k!==j);const cs=[[a.v+b.v,`(${a.e}+${b.e})`],[a.v-b.v,`(${a.e}-${b.e})`],[b.v-a.v,`(${b.e}-${a.e})`],[a.v*b.v,`(${a.e}*${b.e})`],...(b.v?[[a.v/b.v,`(${a.e}/${b.e})`]]:[]),...(a.v?[[b.v/a.v,`(${b.e}/${a.e})`]]:[])];for(const [v,e] of cs){const r=rec([...rest,{v,e}]);if(r)return r}}return null}return rec(nums.map(n=>({v:n,e:String(n)})))}
    function arithmeticData(level){let a,b,c,q,answer;if(level==='easy'){a=randomInt(5,25);b=randomInt(3,18);q=`${a} + ${b}`;answer=a+b}else if(level==='normal'){a=randomInt(12,45);b=randomInt(3,15);q=`${a} × ${b}`;answer=a*b}else if(level==='hard'){a=randomInt(20,90);b=randomInt(5,25);c=randomInt(2,9);q=`(${a} - ${b}) × ${c}`;answer=(a-b)*c}else{a=randomInt(24,120);b=randomInt(6,30);c=randomInt(2,12);const numerator=a+b;const divisor=[2,3,4,5,6,8,10,12][randomInt(0,7)];const n=Math.ceil(numerator/divisor)*divisor;q=`(${n} + ${divisor*randomInt(1,5)}) ÷ ${divisor}`;const parts=q.match(/\d+/g).map(Number);answer=(parts[0]+parts[1])/parts[2]}return{q,answer}}
    function createArithmetic(mode){const level=mode==='ultimate'?'devil':$('diffCalc').value;const d=arithmeticData(level);setQuestion(mode,`题目：${d.q} = ?`,d.answer)}
    function createWord(mode){const level=$('diffWord').value;let question,answer,a,b;if(level==='easy'){a=randomInt(8,28);b=randomInt(2,15);question=`小明有 ${a} 个苹果，又买了 ${b} 个，现在一共有多少个？`;answer=a+b}else if(level==='normal'){a=randomInt(4,16);b=randomInt(3,12);question=`每盒有 ${a} 支铅笔，${b} 盒一共有多少支？`;answer=a*b}else if(level==='hard'){a=randomInt(40,120);b=randomInt(5,35);question=`商店有 ${a} 个气球，卖出 ${b} 个后剩下多少个？`;answer=a-b}else{a=randomInt(12,35);b=randomInt(3,12);const c=randomInt(5,20);question=`${a} 辆车每辆坐 ${b} 人，另外还有 ${c} 人步行到达。一共有多少人？`;answer=a*b+c}setQuestion(mode,`题目：${question}`,answer)}
    function award(mode,level){const points={easy:3,normal:6,hard:10,devil:18}[level]||3;state.totalScore+=points;state.scores[mode]=(state.scores[mode]||0)+points;updateScores();save()}
    function parseFormula(input){if(!/^[0-9+\-*/().\s]+$/.test(input)||!input.trim())return null;try{const value=Function(`"use strict";return (${input})`)();return Number.isFinite(value)?value:null}catch{return null}}
    function submit(mode){if(state.answered[mode])return;const [qid,aid,mid]=modeIds(mode);const raw=$(aid).value.trim();const value=mode==='game24'?parseFormula(raw):Number(raw);if(!raw||value===null||!Number.isFinite(value)){setStatus(mid,tr(mode==='game24'?'invalidFormula':'invalid'),'error');return}if(Math.abs(value-state.questions[mode].answer)<1e-8){setStatus(mid,tr('correct'),'success');state.answered[mode]=true;clearTimer();mark(mode,'correct');const level=mode==='ultimate'?'devil':mode==='calc'?$('diffCalc').value:$('diffWord').value;award(mode,level)}else{setStatus(mid,tr('wrong'),'error');state.answered[mode]=true;clearTimer();mark(mode,'wrong')}}

    const SOLUTION=[[5,3,4,6,7,8,9,1,2],[6,7,2,1,9,5,3,4,8],[1,9,8,3,4,2,5,6,7],[8,5,9,7,6,1,4,2,3],[4,2,6,8,5,3,7,9,1],[7,1,3,9,2,4,8,5,6],[9,6,1,5,3,7,2,8,4],[2,8,7,4,1,9,6,3,5],[3,4,5,2,8,6,1,7,9]];

    function createSudoku(){const board=$('sudokuBoard');board.innerHTML='';PUZZLE.forEach((row,r)=>row.forEach((num,c)=>{const input=document.createElement('input');input.className='sudoku-cell';input.maxLength=1;input.inputMode='numeric';input.setAttribute('aria-label',`Row ${r+1}, column ${c+1}`);if(num){input.value=num;input.disabled=true;input.classList.add('fixed')}else input.addEventListener('input',()=>input.value=input.value.replace(/[^1-9]/g,'').slice(0,1));board.appendChild(input)}));setStatus('msgSudoku',tr('sudokuRule'),'info');state.answered.sudoku=false;startTimer('sudoku')}

    function makeMultiQuestion(){const type=$('multiType').value,level=$('multiDifficulty').value;let question,answer,displayAnswer;if(type==='game24'){let nums,sol;do{nums=[randomInt(1,13),randomInt(1,13),randomInt(1,13),randomInt(1,13)];sol=solve24(nums)}while(!sol);question=`题目：${nums.join('  ')} → 24`;answer=24;displayAnswer=sol}else if(type==='word'){const a=randomInt(6,35),b=randomInt(2,12);if(level==='easy'){question=`${a} 个苹果再加 ${b} 个，一共有多少个？`;answer=a+b}else if(level==='normal'){question=`每袋有 ${a} 颗糖，${b} 袋共有多少颗？`;answer=a*b}else if(level==='hard'){question=`${a*b} 个零件平均装入 ${b} 个盒子，每盒多少个？`;answer=a}else{question=`${a} 辆车每辆乘坐 ${b} 人，另有 ${randomInt(20,90)} 人到场，共有多少人？`;const extra=randomInt(20,90);question=`${a} 辆车每辆乘坐 ${b} 人，另有 ${extra} 人到场，共有多少人？`;answer=a*b+extra}}else{const d=arithmeticData(level);question=`题目：${d.q} = ?`;answer=d.answer}return{question,answer,displayAnswer:displayAnswer||answer}}
    function startMulti(){if(!state.players.some(p=>!p.isUser)){setStatus('msgMulti',tr('emptyBots'),'error');return}state.multiActive=true;state.multiRound=0;state.players.forEach(p=>{p.score=0;p.progress=0});$('rankBox').classList.add('hidden');nextMulti()}

    function submitMulti(){if(!state.multiActive||state.answered.multi)return;const raw=$('multiAns').value.trim(),v=$('multiType').value==='game24'?parseFormula(raw):Number(raw);if(!raw||v===null||!Number.isFinite(v)){setStatus('msgMulti',tr('invalid'),'error');return}state.answered.multi=true;clearTimer();if(Math.abs(v-state.questions.multi.answer)<1e-8){state.players[0].score+=18;state.players[0].progress++;state.totalScore+=3;state.scores.multi+=3;setStatus('msgMulti',tr('correct'),'success');mark('multi','correct');save();updateScores()}else{setStatus('msgMulti',tr('wrong'),'error');mark('multi','wrong')}const delay=randomInt(1200,3500);setTimeout(()=>{if(!state.multiActive)return;state.players.slice(1).forEach(bot=>{bot.progress++;if(Math.random()<({easy:.4,normal:.55,hard:.68,devil:.78}[$('multiDifficulty').value]||.6))bot.score+=18});renderPlayers()},delay)}

    function finishMulti(){state.multiActive=false;clearTimer();const ranked=[...state.players].sort((a,b)=>b.score-a.score);const box=$('rankBox');box.innerHTML='';const h=document.createElement('h3');h.textContent=tr('finalRank');box.appendChild(h);ranked.forEach((p,i)=>{const row=document.createElement('div');row.textContent=`${i+1}. ${p.isUser?tr('you'):p.name} — ${p.score}`;box.appendChild(row)});box.classList.remove('hidden');setStatus('msgMulti',tr('roundDone'),'success')}
    function initLeaderboard(){const list=$('leaderboardList');list.innerHTML='';const row=document.createElement('div');row.textContent=`1. ${state.playerName||tr('you')} — ${state.totalScore}`;list.appendChild(row)}
    function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{const page=b.dataset.page;if(page==='pageUltimate'&&state.totalScore<40){setStatus('msgUltimate',tr('need40'),'error');return}showPage(page)}));document.querySelectorAll('[data-back]').forEach(b=>b.addEventListener('click',()=>showPage('homePage')));$('langBtn').addEventListener('click',()=>{const open=$('langMenu').classList.toggle('open');$('langBtn').setAttribute('aria-expanded',String(open))});document.addEventListener('click',e=>{if(!e.target.closest('.lang-wrap')){$('langMenu').classList.remove('open');$('langBtn').setAttribute('aria-expanded','false')}});
      $('submit24Btn').onclick=()=>submit('game24');$('next24Btn').onclick=create24;$('show24Btn').onclick=()=>showAnswer('game24');$('submitCalcBtn').onclick=()=>submit('calc');$('nextCalcBtn').onclick=()=>createArithmetic('calc');$('showCalcBtn').onclick=()=>showAnswer('calc');$('submitWordBtn').onclick=()=>submit('word');$('nextWordBtn').onclick=()=>createWord('word');$('showWordBtn').onclick=()=>showAnswer('word');$('checkSudokuBtn').onclick=checkSudoku;$('newSudokuBtn').onclick=createSudoku;$('submitUltimateBtn').onclick=()=>submit('ultimate');$('nextUltimateBtn').onclick=()=>createArithmetic('ultimate');$('showUltimateBtn').onclick=()=>showAnswer('ultimate');$('addBotBtn').onclick=addBot;$('clearPlayersBtn').onclick=clearPlayers;$('startMultiBtn').onclick=startMulti;$('submitMultiBtn').onclick=submitMulti;$('nextMultiBtn').onclick=nextMulti;
      ['diff24','diffCalc','diffWord','diffSudoku','multiDifficulty'].forEach(id=>$(id).addEventListener('change',()=>{const mode={diff24:'page24',diffCalc:'pageCalc',diffWord:'pageWord',diffSudoku:'pageSudoku'}[id];if(mode&&state.activeMode){if(mode==='page24'&&state.page==='page24')create24();if(mode==='pageCalc'&&state.page==='pageCalc')createArithmetic('calc');if(mode==='pageWord'&&state.page==='pageWord')createWord('word');if(mode==='pageSudoku'&&state.page==='pageSudoku')createSudoku()}}));$('multiType').addEventListener('change',()=>{if(state.multiActive)nextMulti()});$('playerName').addEventListener('input',e=>{state.playerName=e.target.value.slice(0,24);save();initLeaderboard()});$('playerId').addEventListener('input',e=>{state.playerId=e.target.value.slice(0,20);save()})}
    function init(){load();renderLanguageMenu();fillSelects();bind();$('playerName').value=state.playerName;$('playerId').value=state.playerId;setLanguage(state.lang);updateScores();initLeaderboard();['game24','calc','word','sudoku','multi','ultimate'].forEach(renderProgress);state.players=[{name:state.playerName||tr('you'),score:0,progress:0,isUser:true}];renderPlayers();$('topTimer').textContent='40s';showPage('homePage')}
    init();
  </script>
</body>
</html>
