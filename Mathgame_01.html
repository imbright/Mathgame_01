<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math Puzzle Park</title>
  <style>
    :root {
      --bg1: #eef4ff;
      --bg2: #eefaf4;
      --card: #ffffff;
      --soft: #f7f9ff;
      --line: #e6ebf3;
      --text: #1d2a3a;
      --muted: #63758b;
      --primary: #4d6ef3;
      --green: #22b66d;
      --red: #ea5a55;
      --yellow: #efb94e;
      --gold: #a86d00;
      --shadow: 0 16px 36px rgba(24, 41, 72, .10);
      --white: #ffffff;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(140deg, var(--bg1), var(--bg2));
      color: var(--text);
      font-family: "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body { overflow-x: hidden; }

    .app {
      max-width: 1220px;
      margin: 0 auto;
      padding: 22px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 16px 18px;
      position: sticky;
      top: 12px;
      z-index: 20;
      backdrop-filter: blur(10px);
    }

    .brand {
      font-size: clamp(1.7rem, 2vw, 2.2rem);
      font-weight: 900;
      letter-spacing: .03em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .pill {
      min-width: 150px;
      text-align: center;
      padding: 10px 16px;
      border-radius: 14px;
      border: 1px solid #f1d289;
      background: #fff9ea;
      color: var(--gold);
      font-weight: 800;
      white-space: nowrap;
    }

    .timer-pill {
      min-width: 110px;
      background: #fff;
      border-color: var(--line);
      color: var(--text);
    }

    .lang-wrap { position: relative; }
    .lang-btn {
      min-width: 118px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: .98rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 16px rgba(15,23,42,0.04);
    }

    .lang-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 170px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 6px;
      display: none;
      z-index: 30;
    }
    .lang-menu.open { display: grid; }
    .lang-option {
      border: none;
      background: #fff;
      text-align: left;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: .96rem;
      color: var(--text);
      font-weight: 600;
    }
    .lang-option:hover { background: #f3f6ff; }

    .page { display: none; }
    .page.active { display: block; animation: fade .22s ease; }
    @keyframes fade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .home-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .title {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.2rem);
      letter-spacing: .04em;
      font-weight: 900;
    }

    .player-box {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      background: linear-gradient(135deg, #f9fbff, #f2f6ff);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .field {
      flex: 1;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .field label {
      color: var(--muted);
      font-weight: 700;
      font-size: .95rem;
    }
    .field input, .answer, .difficulty select {
      width: 100%;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .field input:focus, .answer:focus, .difficulty select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(77,110,243,.08);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
    }

    .game-btn {
      width: 100%;
      min-height: 96px;
      border: none;
      border-radius: 18px;
      color: #fff;
      font-size: 1.08rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(26,45,90,0.12);
      transition: transform .16s ease, filter .16s ease;
    }
    .game-btn:hover { transform: translateY(-2px); filter: brightness(1.04); }
    .game-btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-blue { background: linear-gradient(135deg, #5575ff, #7d94ff); }
    .btn-green { background: linear-gradient(135deg, #22b66d, #33d188); }
    .btn-orange { background: linear-gradient(135deg, #f39a2c, #ffbb5c); }
    .btn-purple { background: linear-gradient(135deg, #815ef1, #aa82ff); }
    .btn-red { background: linear-gradient(135deg, #eb5a5a, #ff7f7b); }
    .btn-gold { background: linear-gradient(135deg, #cf931b, #efbe53); }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .back-btn, .action-btn, .soft-btn {
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
    }
    .back-btn { background: linear-gradient(135deg, #eb5a5a, #ff7b7b); }
    .action-btn.btn-green { background: linear-gradient(135deg, #1caf69, #2ad97d); }
    .action-btn.btn-blue { background: linear-gradient(135deg, #5575ff, #7d94ff); }
    .action-btn.btn-orange { background: linear-gradient(135deg, #ef9b30, #ffbd5d); }
    .action-btn.btn-red { background: linear-gradient(135deg, #eb5a5a, #ff7b7b); }
    .soft-btn { background: linear-gradient(135deg, #edf3ff, #eff5ff); color: var(--primary); }

    .mini-score {
      background: #fff9ea;
      border: 1px solid #f1d089;
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--gold);
      font-weight: 800;
    }

    .difficulty {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-weight: 700;
      flex-wrap: wrap;
    }
    .difficulty select {
      min-width: 210px;
      background: #fff;
    }

    .question-box {
      min-height: 90px;
      margin: 18px 0 12px;
      padding: 18px 16px;
      border: 1px solid #e4ebff;
      background: #f8faff;
      border-radius: 16px;
      font-size: clamp(1.1rem, 2vw, 1.42rem);
      line-height: 1.6;
      font-weight: 800;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .answer-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 14px 16px;
      font-size: 1.04rem;
      outline: none;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .status {
      min-height: 28px;
      margin-top: 16px;
      font-weight: 800;
    }
    .status.success { color: var(--green); }
    .status.error { color: var(--red); }
    .status.info { color: var(--primary); }

    .progress-mini {
      display: grid;
      grid-template-columns: repeat(20, minmax(4px, 1fr));
      gap: 4px;
      margin: 12px 0 6px;
      align-items: center;
    }
    .progress-mini .dot {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff;
      border: 2px solid #dde6f4;
    }
    .progress-mini .dot.correct { background: var(--green); border-color: #1ea764; }
    .progress-mini .dot.wrong { background: var(--red); border-color: #d74e48; }

    .sudoku-board {
      display: grid;
      grid-template-columns: repeat(9, minmax(0, 1fr));
      gap: 4px;
      max-width: 430px;
      margin: 18px auto 8px;
      padding: 8px;
      border: 2px solid #ced9ee;
      border-radius: 14px;
      background: #f7f9ff;
    }
    .sudoku-cell {
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid #dfe7f2;
      border-radius: 8px;
      background: #fff;
      text-align: center;
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text);
      outline: none;
    }
    .sudoku-cell.fixed {
      background: #eef3ff;
      color: var(--muted);
    }
    .sudoku-cell:nth-child(3n) { margin-right: 2px; }
    .sudoku-cell:nth-child(n + 19):nth-child(-n + 27),
    .sudoku-cell:nth-child(n + 46):nth-child(-n + 54) {
      border-bottom: 2px solid #cfe0f2;
    }

    .leaderboard {
      margin-top: 18px;
      padding: 16px;
      border-radius: 16px;
      background: #f8faff;
      border: 1px solid var(--line);
    }
    .leaderboard h3 { margin: 0 0 8px; }
    .leaderboard-list { display: grid; gap: 7px; }
    .hidden { display: none !important; }

    @media (max-width: 700px) {
      .app { padding: 14px; }
      .topbar { padding: 12px 14px; }
      .game-grid { grid-template-columns: 1fr 1fr; }
      .card { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand" data-i18n="brand">数学乐园</div>
      <div class="top-actions">
        <div class="pill"><span data-i18n="totalScore">总积分</span>: <strong id="topScore">0</strong></div>
        <div class="pill timer-pill"><span id="topTimer">40s</span></div>
        <div class="lang-wrap">
          <button class="lang-btn" id="langBtn" type="button" aria-expanded="false">
            <span data-i18n="language">语言</span> ▾
          </button>
          <div class="lang-menu" id="langMenu" aria-label="Language menu"></div>
        </div>
      </div>
    </header>

    <main>
      <section class="page active" id="homePage">
        <div class="home-head">
          <h1 class="title" data-i18n="homeTitle">数学益智乐园</h1>
          <div class="pill"><span data-i18n="totalScore">总积分</span>: <strong id="homeScore">0</strong></div>
        </div>

        <div class="card">
          <div class="player-box">
            <div class="field">
              <label data-i18n="playerName">玩家名字</label>
              <input id="playerName" type="text" maxlength="24" placeholder="请输入名字" />
            </div>
            <div class="field">
              <label data-i18n="playerId">玩家 ID</label>
              <input id="playerId" type="text" maxlength="20" placeholder="自定义 ID" />
            </div>
          </div>

          <div class="game-grid">
            <button class="game-btn btn-blue" data-page="page24" data-i18n="game24">24 点</button>
            <button class="game-btn btn-green" data-page="pageCalc" data-i18n="gameCalc">口算</button>
            <button class="game-btn btn-orange" data-page="pageWord" data-i18n="gameWord">应用题</button>
            <button class="game-btn btn-purple" data-page="pageSudoku" data-i18n="gameSudoku">数独</button>
            <button class="game-btn btn-gold" data-page="pageUltimate" id="ultimateBtn" data-i18n="ultimateBtn">终极测试</button>
          </div>

          <div class="leaderboard" id="leaderboardBox">
            <h3 data-i18n="rankTitle">排行榜</h3>
            <div class="leaderboard-list" id="leaderboardList"></div>
          </div>
        </div>
      </section>

      <section class="page" id="page24">
        <div class="panel-header">
          <div class="header-left">
            <button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button>
            <div class="mini-score"><span data-i18n="singleScore">单项积分</span>: <strong id="score24">0</strong></div>
          </div>
          <div class="difficulty">
            <span data-i18n="difficulty">难度</span>
            <select id="diff24"></select>
          </div>
        </div>
        <div class="card">
          <div class="progress-mini" id="progress24"></div>
          <div class="question-box" id="q24">题目：--</div>
          <input class="answer-input" id="ans24" type="text" placeholder="输入算式" />
          <div class="controls">
            <button class="action-btn btn-green" id="submit24Btn" data-i18n="submitBtn">提交答案</button>
            <button class="action-btn btn-blue" id="next24Btn" data-i18n="nextBtn">下一题</button>
            <button class="action-btn btn-orange" id="show24Btn" data-i18n="showAnswerBtn">查看答案</button>
          </div>
          <div class="status" id="msg24"></div>
          <div class="status info" id="show24Answer"></div>
          <div class="status info" id="timer24"></div>
        </div>
      </section>

      <section class="page" id="pageCalc">
        <div class="panel-header">
          <div class="header-left">
            <button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button>
            <div class="mini-score"><span data-i18n="singleScore">单项积分</span>: <strong id="scoreCalc">0</strong></div>
          </div>
          <div class="difficulty">
            <span data-i18n="difficulty">难度</span>
            <select id="diffCalc"></select>
          </div>
        </div>
        <div class="card">
          <div class="progress-mini" id="progressCalc"></div>
          <div class="question-box" id="qCalc">题目：--</div>
          <input class="answer-input" id="ansCalc" type="number" step="any" placeholder="输入答案" />
          <div class="controls">
            <button class="action-btn btn-green" id="submitCalcBtn" data-i18n="submitBtn">提交答案</button>
            <button class="action-btn btn-blue" id="nextCalcBtn" data-i18n="nextBtn">下一题</button>
            <button class="action-btn btn-orange" id="showCalcBtn" data-i18n="showAnswerBtn">查看答案</button>
          </div>
          <div class="status" id="msgCalc"></div>
          <div class="status info" id="showCalcAnswer"></div>
          <div class="status info" id="timerCalc"></div>
        </div>
      </section>

      <section class="page" id="pageWord">
        <div class="panel-header">
          <div class="header-left">
            <button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button>
            <div class="mini-score"><span data-i18n="singleScore">单项积分</span>: <strong id="scoreWord">0</strong></div>
          </div>
          <div class="difficulty">
            <span data-i18n="difficulty">难度</span>
            <select id="diffWord"></select>
          </div>
        </div>
        <div class="card">
          <div class="progress-mini" id="progressWord"></div>
          <div class="question-box" id="qWord">题目：--</div>
          <input class="answer-input" id="ansWord" type="number" step="any" placeholder="输入答案" />
          <div class="controls">
            <button class="action-btn btn-green" id="submitWordBtn" data-i18n="submitBtn">提交答案</button>
            <button class="action-btn btn-blue" id="nextWordBtn" data-i18n="nextBtn">下一题</button>
            <button class="action-btn btn-orange" id="showWordBtn" data-i18n="showAnswerBtn">查看答案</button>
          </div>
          <div class="status" id="msgWord"></div>
          <div class="status info" id="showWordAnswer"></div>
          <div class="status info" id="timerWord"></div>
        </div>
      </section>

      <section class="page" id="pageSudoku">
        <div class="panel-header">
          <div class="header-left">
            <button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button>
            <div class="mini-score"><span data-i18n="singleScore">单项积分</span>: <strong id="scoreSudoku">0</strong></div>
          </div>
          <div class="difficulty">
            <span data-i18n="difficulty">难度</span>
            <select id="diffSudoku"></select>
          </div>
        </div>
        <div class="card">
          <div class="progress-mini" id="progressSudoku"></div>
          <div id="sudokuBoard" class="sudoku-board"></div>
          <div class="controls">
            <button class="action-btn btn-green" id="checkSudokuBtn" data-i18n="checkBtn">检查答案</button>
            <button class="action-btn btn-blue" id="newSudokuBtn" data-i18n="newSudokuBtn">新数独</button>
            <button class="soft-btn" id="retrySudokuBtn" data-i18n="retryBtn">错题重做</button>
          </div>
          <div class="status" id="msgSudoku"></div>
          <div class="status info" id="timerSudoku"></div>
        </div>
      </section>

      <section class="page" id="pageUltimate">
        <div class="panel-header">
          <div class="header-left">
            <button class="back-btn" data-back="home" data-i18n="homeBtn">返回主页</button>
            <div class="mini-score"><span data-i18n="ultimateScore">终极测试</span>: <strong id="scoreUltimate">0</strong></div>
          </div>
          <div class="difficulty">
            <span data-i18n="difficulty">难度</span>
            <select id="diffUltimate"></select>
          </div>
        </div>
        <div class="card">
          <div class="progress-mini" id="progressUltimate"></div>
          <div class="question-box" id="qUltimate">题目：--</div>
          <input class="answer-input" id="ansUltimate" type="number" step="any" placeholder="输入答案" />
          <div class="controls">
            <button class="action-btn btn-green" id="submitUltimateBtn" data-i18n="submitBtn">提交答案</button>
            <button class="action-btn btn-blue" id="nextUltimateBtn" data-i18n="nextBtn">下一题</button>
            <button class="action-btn btn-orange" id="showUltimateBtn" data-i18n="showAnswerBtn">查看答案</button>
          </div>
          <div class="status" id="msgUltimate"></div>
          <div class="status info" id="showUltimateAnswer"></div>
          <div class="status info" id="timerUltimate"></div>
        </div>
      </section>
    </main>
  </div>

    function clearTimer() {
      if (state.timerId) clearInterval(state.timerId);

    function startTimer(seconds, onExpire) {
      clearTimer();
      state.topTimer = seconds;
      updateTopTimerText(seconds);
      const perGameTimer = (id) => {
        const el = $(id);
        if (el) el.textContent = `${seconds}s`;
      };
      perGameTimer('timer24');
      perGameTimer('timerCalc');
      perGameTimer('timerWord');
      perGameTimer('timerSudoku');
      perGameTimer('timerUltimate');

      state.timerId = setInterval(() => {
        state.topTimer -= 1;
        updateTopTimerText(Math.max(0, state.topTimer));
        if (state.topTimer <= 0) {
          clearTimer();
          if (onExpire) onExpire();
          const text = tr('timeUp');
          updateTopTimerText(text);
          ['timer24', 'timerCalc', 'timerWord', 'timerSudoku', 'timerUltimate'].forEach(id => {
            const el = $(id); if (el) el.textContent = text;
          });
        }
      }, 1000);
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function solve24(nums) {
      const arr = nums.slice();
      const evaluate = (values, expr) => {
        if (values.length === 1) {
          return Math.abs(values[0] - 24) < 1e-8 ? expr : null;
        }
        for (let i = 0; i < values.length; i++) {
          for (let j = i + 1; j < values.length; j++) {
            const rest = values.filter((_, idx) => idx !== i && idx !== j);
            const a = values[i];
            const b = values[j];
            const candidates = [
              [a + b, `(${expr} + ${b})`],
              [a - b, `(${expr} - ${b})`],
              [b - a, `(${b} - ${expr})`],
              [a * b, `(${expr} * ${b})`],
              [a / b, `(${expr} / ${b})`],
              [b / a, `(${b} / ${expr})`]
            ];
            for (const [v, text] of candidates) {
              if (!Number.isFinite(v)) continue;
              const result = evaluate([...rest, v], text);
              if (result) return result;
            }
          }
        }
        return null;
      };
      return evaluate(arr, arr[0]) || null;
    }

    function create24Question() {
      let nums = [randomInt(1, 10), randomInt(1, 10), randomInt(1, 10), randomInt(1, 10)];
      let answer = solve24(nums);
      while (!answer) {
        nums = [randomInt(1, 10), randomInt(1, 10), randomInt(1, 10), randomInt(1, 10)];
        answer = solve24(nums);
      }
      state.questions.page24 = { nums, answer };
      $('q24').textContent = `题目：${nums.join(' ')} = 24`;
      $('ans24').value = '';

      startTimer(40, () => {

        markProgress('page24', 'wrong');
      });

    function buildSudoku() {
      const board = $('sudokuBoard');
      board.innerHTML = '';
      const puzzle = [
        [5,3,0,0,7,0,0,0,0],
        [6,0,0,1,9,5,0,0,0],
        [0,9,8,0,0,0,0,6,0],
        [8,0,0,0,6,0,0,0,3],
        [4,0,0,8,0,3,0,0,1],
        [7,0,0,0,2,0,0,0,6],
        [0,6,0,0,0,0,2,8,0],
        [0,0,0,4,1,9,0,0,5],
        [0,0,0,0,8,0,0,7,9]
      ];
      for (let row = 0; row < 9; row++) {
        for (let col = 0; col < 9; col++) {
          const input = document.createElement('input');
          input.type = 'text';
          input.maxLength = 1;
          input.className = 'sudoku-cell';
          if (puzzle[row][col]) {
            input.value = String(puzzle[row][col]);
            input.disabled = true;
            input.classList.add('fixed');
          }
          input.addEventListener('input', () => {
            input.value = input.value.replace(/[^1-9]/g, '').slice(0, 1);
          });
          board.appendChild(input);
        }
      }
      setStatus('msgSudoku', tr('sudokuRule'), 'info');
      startTimer(40, () => {
        setStatus('msgSudoku', tr('timeUp'), 'error');
        markProgress('sudoku', 'wrong');
      });
    }

    function checkSudoku() {
      const cells = [...document.querySelectorAll('.sudoku-cell')];
      if (cells.some(cell => !cell.disabled && !cell.value)) {
        setStatus('msgSudoku', tr('sudokuIncomplete'), 'error');
        return;
      }
      const grid = [];
      for (let i = 0; i < 9; i++) {
        grid.push(cells.slice(i * 9, i * 9 + 9).map(el => Number(el.value || 0)));
      }
      const valid = (arr) => arr.length === 9 && new Set(arr).size === 9 && arr.every(n => n > 0);
      const rows = grid.every(valid);
      const cols = Array.from({ length: 9 }, (_, c) => grid.map(r => r[c])).every(valid);
      const boxes = Array.from({ length: 9 }, (_, idx) => {
        const r = Math.floor(idx / 3) * 3;
        const c = (idx % 3) * 3;
        const values = [];
        for (let rr = r; rr < r + 3; rr++) {
          for (let cc = c; cc < c + 3; cc++) values.push(grid[rr][cc]);
        }
        return valid(values);
      }).every(Boolean);
      if (rows && cols && boxes) {
        setStatus('msgSudoku', tr('sudokuCorrect'), 'success');
        state.totalScore += 10;
        markProgress('sudoku', 'correct');
      } else {
        setStatus('msgSudoku', tr('sudokuWrong'), 'error');
        markProgress('sudoku', 'wrong');
      }
      updateScores();
      saveState();
    }

        const v = Number($('ansWord').value);
        if (Number.isNaN(v)) { setStatus('msgWord', tr('invalid'), 'error'); return; }
        if (Math.abs(v - state.questions.word.answer) < 1e-6) {
          setStatus('msgWord', tr('correct'), 'success');
          state.totalScore += 6;
          state.scores.word += 6;
          markProgress('word', 'correct');
        } else {
          setStatus('msgWord', tr('wrong'), 'error');
          markProgress('word', 'wrong');
        }
        updateScores();
        saveState();
      });
      $('nextWordBtn').addEventListener('click', createWordQuestion);
      $('showWordBtn').addEventListener('click', () => $('showWordAnswer').textContent = tr('answerIs') + state.questions.word.answer);

      $('checkSudokuBtn').addEventListener('click', checkSudoku);
      $('newSudokuBtn').addEventListener('click', buildSudoku);
      $('retrySudokuBtn').addEventListener('click', () => setStatus('msgSudoku', tr('retryQueue'), 'info'));

      $('submitUltimateBtn').addEventListener('click', () => {
        const v = Number($('ansUltimate').value);
        if (Number.isNaN(v)) { setStatus('msgUltimate', tr('invalid'), 'error'); return; }
        if (Math.abs(v - state.questions.ultimate.answer) < 1e-6) {
          setStatus('msgUltimate', tr('correct'), 'success');
          state.totalScore += 18;
          state.scores.ultimate += 18;
          markProgress('ultimate', 'correct');
        } else {
          setStatus('msgUltimate', tr('wrong'), 'error');
          markProgress('ultimate', 'wrong');
        }
        updateScores();
        saveState();
      });
      $('nextUltimateBtn').addEventListener('click', createUltimateQuestion);
      $('showUltimateBtn').addEventListener('click', () => $('showUltimateAnswer').textContent = tr('answerIs') + state.questions.ultimate.answer);

      $('playerName').addEventListener('input', e => {
        state.playerName = e.target.value.slice(0, 24);
        saveState();
      });
      $('playerId').addEventListener('input', e => {
        state.playerId = e.target.value.slice(0, 20);
        saveState();
      });
    }

    function init() {
      loadState();
      renderLangMenu();
      bindDifficultySelects();
      bindEvents();
      $('playerName').value = state.playerName;
      $('playerId').value = state.playerId;
      setLanguage(state.lang);
      renderMiniProgress('progress24', state.progress.page24);
      renderMiniProgress('progressCalc', state.progress.calc);
      renderMiniProgress('progressWord', state.progress.word);
      renderMiniProgress('progressSudoku', state.progress.sudoku);
      renderMiniProgress('progressUltimate', state.progress.ultimate);
      create24Question();
      createCalcQuestion();
      createWordQuestion();
      buildSudoku();
      createUltimateQuestion();
      updateScores();
      showPage('homePage');
    }

    init();
  </script>
</body>
</html>
